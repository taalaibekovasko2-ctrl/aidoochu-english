  { photo:"img/hotshot.jpg", en:"Hotshot: pickup", title:["Хотшот: жүк алуу", "Хотшот: жүк алу", "Хотшот: погрузка"], lines:[
    ["me", "Hello! I'm here with a hotshot to pick up a load.", "Саламатсызбы! Хотшот менен жүк алганы келдим.", "Сәлеметсіз бе! Хотшотпен жүк алуға келдім.", "Здравствуйте! Я на хотшоте, за грузом."],
    ["clerk", "Hello! What's your load number?", "Саламатсызбы! Жүгүңдүн номери канча?", "Сәлеметсіз бе! Жүгіңнің нөмірі қандай?", "Здравствуйте! Какой номер груза?"],
    ["me", "My load number is 458921.", "Менин жүк номерим 458921.", "Менің жүк нөмірім 458921.", "Мой номер груза 458921."],
    ["clerk", "Which company are you with?", "Кайсы компания менен келдиң?", "Қай компаниямен келдің?", "От какой ты компании?"],
    ["me", "I'm with Lider Holding.", "Лидер Холдинг компаниясынан келдим.", "Лидер Холдинг компаниясынан келдім.", "Я от компании Lider Holding."],
    ["clerk", "Where are you taking the load?", "Жүктү кайсы жакка алып барасың?", "Жүкті қай жаққа апарасың?", "Куда везёшь груз?"],
    ["me", "From Riverside, California, to Las Vegas.", "Калифорниянын Риверсайд шаарынан Лас-Вегаска.", "Калифорнияның Риверсайд қаласынан Лас-Вегасқа.", "Из Риверсайда, Калифорния, в Лас-Вегас."],
    ["clerk", "What kind of trailer do you have?", "Сенде кандай трейлер бар?", "Сенде қандай трейлер бар?", "Какой у тебя трейлер?"],
    ["me", "I have a 40-foot gooseneck flatbed trailer.", "Менде 40 футтук гузнек флэтбед трейлер бар.", "Менде 40 футтық гузнек флэтбед трейлер бар.", "У меня 40-футовый гузнек-платформа."],
    ["clerk", "Do you have chains, straps, and securement equipment?", "Чынжыр, ремень жана жүк бекитүүчү жабдууларың барбы?", "Шынжыр, белдік және жүк бекіту жабдықтарың бар ма?", "Есть цепи, ремни и крепёж?"],
    ["me", "Yes, I have everything.", "Ооба, баары бар.", "Иә, бәрі бар.", "Да, всё есть."],
    ["clerk", "We're loading one piece of construction equipment. It weighs 7,500 pounds.", "Бир курулуш техникасын жүктөйбүз. Салмагы 7 500 фунт.", "Бір құрылыс техникасын тиейміз. Салмағы 7 500 фунт.", "Грузим одну единицу стройтехники. Вес 7 500 фунтов."],
    ["me", "Okay. Who will load the equipment?", "Макул, техниканы ким жүктөйт?", "Жарайды, техниканы кім тиейді?", "Хорошо. Кто будет грузить технику?"],
    ["clerk", "Our operator will load it.", "Биздин оператор жүктөп берет.", "Біздің оператор тиеп береді.", "Наш оператор погрузит."],
    ["me", "Please put it in the middle of the trailer so the weight is balanced.", "Салмагы туура бөлүнгөндөй трейлердин ортосуна коюңуз.", "Салмағы дұрыс бөлінетіндей трейлердің ортасына қойыңыз.", "Поставьте по центру трейлера, чтобы вес распределился."],
    ["clerk", "Is this spot okay?", "Ушул жерге койсок болобу?", "Осы жерге қойсақ бола ма?", "Сюда нормально?"],
    ["me", "Yes, that's good. Now I'll secure it with chains.", "Ооба, жакшы. Эми чынжыр менен бекитем.", "Иә, жақсы. Енді шынжырмен бекітемін.", "Да, хорошо. Теперь закреплю цепями."],
    ["clerk", "Let me know when you're done.", "Бүткөндө мага кабар бер.", "Біткенде маған хабар бер.", "Скажи, когда закончишь."],
    ["me", "I'm done securing it. Can I get the paperwork?", "Бекитип бүттүм. Жүктүн документин бересизби?", "Бекітіп болдым. Жүк құжатын бересіз бе?", "Я закрепил. Дадите документы на груз?"],
    ["clerk", "Yes, but first I'll check the load.", "Ооба, бирок адегенде жүктү текшерип чыгам.", "Иә, бірақ алдымен жүкті тексеремін.", "Да, но сначала проверю груз."],
    ["me", "Okay, go ahead and check it.", "Макул, текшерип алыңыз.", "Жарайды, тексеріп алыңыз.", "Хорошо, проверяйте."],
    ["clerk", "Everything looks good. Here's your bill of lading. Sign here.", "Баары жакшы. Мына жүк документиң. Ушул жерге кол кой.", "Бәрі жақсы. Міне жүк құжатың. Осы жерге қол қой.", "Всё хорошо. Вот твой BOL. Распишись здесь."],
    ["me", "I signed it. Can I go now?", "Кол коюп бүттүм. Эми кете берсем болобу?", "Қол қойып болдым. Енді кете берсем бола ма?", "Подписал. Можно ехать?"],
    ["clerk", "Yes, you can go. Have a safe trip!", "Ооба, кете бер. Жолуң шыдыр болсун!", "Иә, жүре бер. Жолың болсын!", "Да, езжай. Счастливого пути!"],
    ["me", "Thank you, take care!", "Рахмат, жакшы калыңыз!", "Рахмет, сау болыңыз!", "Спасибо, всего доброго!"]
  ]},
  { photo:"img/rgn.jpg", en:"Hotshot: delivery", title:["Хотшот: жүк жеткирүү", "Хотшот: жүк жеткізу", "Хотшот: доставка"], lines:[
    ["me", "Hello! I brought your construction equipment.", "Саламатсызбы! Силерге курулуш техникасын алып келдим.", "Сәлеметсіз бе! Сіздерге құрылыс техникасын әкелдім.", "Здравствуйте! Привёз вам стройтехнику."],
    ["clerk", "Hello! Which company are you with?", "Саламатсызбы! Кайсы компаниядан келдиңиз?", "Сәлеметсіз бе! Қай компаниядан келдіңіз?", "Здравствуйте! Вы от какой компании?"],
    ["me", "I'm with Lider Holding.", "Лидер Холдинг компаниясынан келдим.", "Лидер Холдинг компаниясынан келдім.", "Я от компании Lider Holding."],
    ["clerk", "Can I see the paperwork?", "Жүктүн документин көрсөтүңүзчү.", "Жүк құжатын көрсетіңізші.", "Покажите документы на груз."],
    ["me", "Here's my bill of lading.", "Мына, бул менин жүк документим.", "Міне, бұл менің жүк құжатым.", "Вот мой BOL."],
    ["clerk", "Did you bring one piece of construction equipment?", "Бир курулуш техникасын алып келдиңизби?", "Бір құрылыс техникасын әкелдіңіз бе?", "Вы привезли одну единицу техники?"],
    ["me", "Yes, one piece. It weighs 7,500 pounds.", "Ооба, бир даана. Салмагы 7 500 фунт.", "Иә, бір дана. Салмағы 7 500 фунт.", "Да, одну. Вес 7 500 фунтов."],
    ["clerk", "Good. Park your trailer in the open area over there.", "Жакшы. Трейлериңизди тигил бош аянтка токтотуңуз.", "Жақсы. Трейлеріңізді ана бос алаңға қойыңыз.", "Хорошо. Поставьте трейлер вон на ту свободную площадку."],
    ["me", "Will we unload the equipment there?", "Техниканы ошол жерден түшүрөбүзбү?", "Техниканы сол жерден түсіреміз бе?", "Технику будем разгружать там?"],
    ["clerk", "Yes, our operator will come and unload it.", "Ооба, биздин оператор келип түшүрөт.", "Иә, біздің оператор келіп түсіреді.", "Да, придёт наш оператор и разгрузит."],
    ["me", "Okay, I'll get the chains ready to remove.", "Макул, чынжырларды чечүүгө даярдап коём.", "Жарайды, шынжырларды ағытуға дайындап қоямын.", "Хорошо, подготовлю цепи к снятию."],
    ["clerk", "First set the trailer brakes and chock the wheels.", "Адегенде трейлердин тормозун коюп, дөңгөлөккө такоол кой.", "Алдымен трейлер тежегішін қойып, дөңгелекке тірек қой.", "Сначала поставь трейлер на тормоз и подложи упоры."],
    ["me", "Okay, I checked everything. Can I remove the chains now?", "Макул, баарын текшердим. Эми чынжырларды чечсем болобу?", "Жарайды, бәрін тексердім. Енді шынжырларды ағытсам бола ма?", "Хорошо, всё проверил. Можно снимать цепи?"],
    ["clerk", "Yes, when the operator is ready.", "Ооба, оператор даяр болгондо чеч.", "Иә, оператор дайын болғанда ағыт.", "Да, когда оператор будет готов."],
    ["me", "The operator is here. I removed the chains.", "Оператор келди. Чынжырларды чечип бүттүм.", "Оператор келді. Шынжырларды ағытып болдым.", "Оператор пришёл. Цепи снял."],
    ["clerk", "Good, we're unloading it now.", "Жакшы, азыр техниканы түшүрөбүз.", "Жақсы, қазір техниканы түсіреміз.", "Хорошо, сейчас разгружаем."],
    ["me", "Is the equipment in good condition? Any damage?", "Техника жакшы абалдабы? Бузулган жери жокпу?", "Техника жақсы күйде ме? Бүлінген жері жоқ па?", "Техника в порядке? Повреждений нет?"],
    ["clerk", "Yes, everything is fine. The load is fully accepted.", "Ооба, баары жакшы. Жүк толугу менен кабыл алынды.", "Иә, бәрі жақсы. Жүк толығымен қабылданды.", "Да, всё хорошо. Груз принят полностью."],
    ["me", "Then can you sign my paperwork?", "Анда менин документиме кол коюп бересизби?", "Онда менің құжатыма қол қойып бересіз бе?", "Тогда подпишете мои документы?"],
    ["clerk", "Of course. Here, I signed it.", "Албетте. Мына, кол коюп бердим.", "Әрине. Міне, қол қойып бердім.", "Конечно. Вот, подписал."],
    ["me", "Thank you. Can I take a picture to prove the delivery?", "Рахмат. Жүктү тапшырганымды тастыктоо үчүн сүрөткө тартсам болобу?", "Рахмет. Жүкті тапсырғанымды растау үшін суретке түсірсем бола ма?", "Спасибо. Можно сфотографировать для подтверждения доставки?"],
    ["clerk", "Yes, you can.", "Ооба, болот.", "Иә, болады.", "Да, можно."],
    ["me", "Thank you. Can I leave now?", "Рахмат. Эми чыгып кетсем болобу?", "Рахмет. Енді шығып кетсем бола ма?", "Спасибо. Можно уезжать?"],
    ["clerk", "Yes, drive safe!", "Ооба, жакшы барыңыз!", "Иә, жақсы барыңыз!", "Да, счастливого пути!"],
    ["me", "Thank you, take care!", "Рахмат, жакшы калыңыз!", "Рахмет, сау болыңыз!", "Спасибо, всего доброго!"]
  ]},
  { photo:"img/d2/16.jpg", en:"Hotshot: wrong warehouse", title:["Хотшот: күтүлбөгөн жагдай", "Хотшот: күтпеген жағдай", "Хотшот: непредвиденная ситуация"], lines:[
    ["me", "Hello! I'm here to pick up, but I can't find the loading area.", "Саламатсызбы! Жүк алганы келдим, бирок жүктөй турган жерди таппай жатам.", "Сәлеметсіз бе! Жүк алуға келдім, бірақ тиеу орнын таппай жүрмін.", "Здравствуйте! Я за грузом, но не могу найти место погрузки."],
    ["clerk", "What address are you at?", "Кайсы даректесиң?", "Қай мекенжайдасың?", "По какому ты адресу?"],
    ["me", "I'm at the address on the paperwork.", "Документте көрсөтүлгөн дарекке келдим.", "Құжатта көрсетілген мекенжайға келдім.", "Я по адресу из документов."],
    ["clerk", "You're at the right place, but the load is in another warehouse.", "Туура жерге келипсиң, бирок жүк башка кампада турат.", "Дұрыс жерге келіпсің, бірақ жүк басқа қоймада тұр.", "Ты на месте, но груз на другом складе."],
    ["me", "Where is that warehouse?", "Ал кампа кайсы жакта?", "Ол қойма қай жақта?", "Где этот склад?"],
    ["clerk", "Go straight down this street and enter through the second gate.", "Ушул көчө менен түз барып, экинчи дарбазадан кир.", "Осы көшемен тура барып, екінші қақпадан кір.", "Прямо по этой улице, въезжай во вторые ворота."],
    ["me", "Can I get in there with a big trailer?", "Ал жакка чоң трейлер менен кирсе болобу?", "Ол жаққа үлкен трейлермен кіруге бола ма?", "Туда можно заехать с большим трейлером?"],
    ["clerk", "Yes, but go slowly. The turn is tight.", "Ооба, бирок акырын кир. Бурула турган жер тар.", "Иә, бірақ ақырын кір. Бұрылыс тар.", "Да, но медленно. Поворот узкий."],
    ["me", "Okay. Is the load ready?", "Макул. Жүк даярбы?", "Жарайды. Жүк дайын ба?", "Хорошо. Груз готов?"],
    ["clerk", "Not yet. You need to wait a little longer.", "Азырынча даяр эмес, дагы бир аз күтүү керек.", "Әлі дайын емес, тағы аз күту керек.", "Пока нет. Нужно ещё немного подождать."],
    ["me", "About how long will I wait?", "Болжол менен канча убакыт күтөм?", "Шамамен қанша уақыт күтемін?", "Примерно сколько ждать?"],
    ["clerk", "About half an hour.", "Жарым сааттай.", "Жарты сағаттай.", "Около получаса."],
    ["me", "Okay, I'll wait in the parking area outside.", "Макул, сырттагы токтотуучу жайда күтүп турам.", "Жарайды, сыртқы тұрақта күтіп тұрамын.", "Хорошо, подожду на стоянке снаружи."],
    ["clerk", "We'll let you know when the load is ready.", "Жүк даяр болгондо сага кабар беребиз.", "Жүк дайын болғанда саған хабар береміз.", "Сообщим, когда груз будет готов."],
    ["me", "Thank you!", "Рахмат!", "Рахмет!", "Спасибо!"]
  ]},
  { photo:"img/d2/09.jpg", en:"Weigh station: full inspection", title:["Тараза: толук текшерүү","Таразы: толық тексеру","Весовая: полная проверка"], lines:[
    ["officer", "Hi. Bring your documents inside.", "Салам. Документтериңди алып ичкери кир.", "Сәлем. Құжаттарыңды алып ішке кір.", "Привет. Заходи внутрь с документами."],
    ["me", "Hi, okay.", "Салам, макул.", "Сәлем, жарайды.", "Привет, хорошо."],
    ["officer", "Do you have a driver's license?", "Праваң барбы?", "Куәлігің бар ма?", "У тебя есть права?"],
    ["me", "Yes, I do.", "Ооба, бар.", "Иә, бар.", "Да, есть."],
    ["officer", "Give me your license and work permit.", "Праваңды жана work permit'иңди бер.", "Куәлігің мен work permit-іңді бер.", "Дай права и разрешение на работу."],
    ["me", "Sure, sir. Here is my license and my work permit.", "Макул, сэр. Мына правам жана work permit'им.", "Жарайды, сэр. Міне куәлігім мен work permit-ім.", "Хорошо, сэр. Вот мои права и разрешение."],
    ["officer", "Do you have the truck registration and insurance?", "Трактын техпаспорту жана страховкасы барбы?", "Трактың техпаспорты мен сақтандыруы бар ма?", "Есть регистрация и страховка на трак?"],
    ["me", "Yes, sir. Here is my insurance and registration.", "Ооба, сэр. Мына страховкам жана техпаспортум.", "Иә, сэр. Міне сақтандыруым мен техпаспортым.", "Да, сэр. Вот страховка и регистрация."],
    ["officer", "What are you hauling?", "Эмне ташып баратасың?", "Не тасып барасың?", "Что везёшь?"],
    ["me", "Sir, I'm hauling an Amazon trailer.", "Сэр, Amazon трейлерин алып баратам.", "Сэр, Amazon трейлерін алып барамын.", "Сэр, везу трейлер Amazon."],
    ["officer", "Where are you coming from?", "Кайдан келе жатасың?", "Қайдан келе жатырсың?", "Откуда едешь?"],
    ["me", "Sir, I'm coming from Las Vegas.", "Сэр, Лас-Вегастан келе жатам.", "Сэр, Лас-Вегастан келе жатырмын.", "Сэр, еду из Лас-Вегаса."],
    ["officer", "Where are you going?", "Кайда бара жатасың?", "Қайда бара жатырсың?", "Куда едешь?"],
    ["me", "Sir, I'm going to Chicago.", "Сэр, Чикагого бара жатам.", "Сэр, Чикагоға бара жатырмын.", "Сэр, еду в Чикаго."],
    ["officer", "Are you a team driver, or are you driving solo?", "Команда менен айдайсыңбы же жалгызбы?", "Командамен жүргізесің бе, жалғыз ба?", "Ты в команде или едешь один?"],
    ["me", "Sir, I'm driving solo.", "Сэр, жалгыз айдап баратам.", "Сэр, жалғыз жүргізіп барамын.", "Сэр, еду один."],
    ["officer", "Did you do a pre-trip inspection on the truck?", "Тракка pre-trip текшерүү жасадыңбы?", "Тракқа pre-trip тексеру жасадың ба?", "Ты делал предрейсовый осмотр трака?"],
    ["me", "Yes, sir. I did my pre-trip this morning.", "Ооба, сэр. Бүгүн эртең менен жасадым.", "Иә, сэр. Бүгін таңертең жасадым.", "Да, сэр. Сделал сегодня утром."],
    ["officer", "How long have you been driving?", "Канча сааттан бери айдап келе жатасың?", "Қанша сағаттан бері жүргізіп келесің?", "Сколько часов ты уже за рулём?"],
    ["me", "I've been driving for two hours.", "Эки сааттан бери айдап келе жатам.", "Екі сағаттан бері жүргізіп келемін.", "Еду уже два часа."],
    ["officer", "We're going to inspect your truck.", "Тракыңды текшеребиз.", "Тракыңды тексереміз.", "Сейчас проверим твой трак."],
    ["me", "Okay, sir.", "Макул, сэр.", "Жарайды, сэр.", "Хорошо, сэр."],
    ["officer", "When I say \"brake,\" press the brake. I'll check the rear lights.", "«Тормоз» десем, тормоз теп. Мен арткы чырактарды карайм.", "«Тежегіш» десем, тежегішті бас. Мен артқы шамдарды қараймын.", "Скажу «тормоз» — жми тормоз. Я проверю задние фонари."],
    ["me", "Okay, sir.", "Макул, сэр.", "Жарайды, сэр.", "Хорошо, сэр."],
    ["officer", "Turn on your hazards.", "Аварийканы күйгүз.", "Аварияны қос.", "Включи аварийку."],
    ["me", "My hazards are on.", "Аварийканы күйгүздүм.", "Аварияны қостым.", "Аварийка включена."],
    ["officer", "Right turn signal. Now left turn signal.", "Оң поворотту күйгүз. Эми сол поворотту.", "Оң бұрылысты қос. Енді сол бұрылысты.", "Правый поворотник. Теперь левый."],
    ["officer", "High beams. Now low beams.", "Алыскы жарык. Эми жакынкы жарык.", "Алыс жарық. Енді жақын жарық.", "Дальний свет. Теперь ближний."],
    ["me", "These are the high beams.", "Бул алыскы жарык.", "Бұл алыс жарық.", "Это дальний свет."],
    ["me", "These are the low beams.", "Бул жакынкы жарык.", "Бұл жақын жарық.", "Это ближний свет."],
    ["officer", "Turn on the wipers and spray the windshield.", "Дворникти күйгүзүп, айнекке суу чач.", "Дворникті қосып, әйнекке су шаш.", "Включи дворники и брызни на лобовое."],
    ["me", "The wipers are on, and the windshield is sprayed.", "Дворник иштеп, айнекке суу чачылды.", "Дворник жұмыс істеп, әйнекке су шашылды.", "Дворники работают, омыватель брызнул."],
    ["officer", "You did well. Do you have an ELD?", "Жакшы өттүң. ELD'иң барбы?", "Жақсы өттің. ELD-ің бар ма?", "Молодец. ELD есть?"],
    ["me", "Yes, here is my ELD.", "Ооба, мына менин ELD'им.", "Иә, міне менің ELD-ім.", "Да, вот мой ELD."],
    ["officer", "All your documents are in order.", "Бардык документтериң жайында.", "Барлық құжаттарың реттелген.", "Все документы в порядке."],
    ["me", "Can I continue on my way?", "Жолумду уланта берсем болобу?", "Жолымды жалғастыра берсем бола ма?", "Можно ехать дальше?"],
    ["officer", "Yes, you can go.", "Ооба, кете бер.", "Иә, жүре бер.", "Да, можешь ехать."]
  ]},
  { photo:"img/d2/10.jpg", en:"FedEx / UPS: pickup", title:["FedEx / UPS: жүк алуу", "FedEx / UPS: жүк алу", "FedEx / UPS: забор груза"], lines:[
    ["me", "Hello, I'm here to pick up a load.", "Саламатсызбы, жүк алганы келдим.", "Сәлеметсіз бе, жүк алуға келдім.", "Здравствуйте, я за грузом."],
    ["clerk", "Hi. Do you have closed-toe shoes and a safety vest?", "Салам. Бут кийимиң туюкпу, жилетиң барбы?", "Сәлем. Аяқ киімің жабық па, жилетің бар ма?", "Привет. Есть закрытая обувь и жилет?"],
    ["me", "Yes, I have closed-toe shoes and a vest.", "Ооба, туюк бут кийимим жана жилетим бар.", "Иә, жабық аяқ киімім мен жилетім бар.", "Да, закрытая обувь и жилет есть."],
    ["clerk", "Where are you taking it?", "Кайсы жакка алып кетесиң?", "Қай жаққа алып кетесің?", "Куда везёшь?"],
    ["me", "From Los Angeles to Chicago.", "Лос-Анжелестен Чикагого.", "Лос-Анджелестен Чикагоға.", "Из Лос-Анджелеса в Чикаго."],
    ["clerk", "Which company are you with?", "Кайсы компаниядан келдиң?", "Қай компаниядан келдің?", "От какой ты компании?"],
    ["me", "I'm with Lider Holding.", "Lider Holding компаниясынан келдим.", "Lider Holding компаниясынан келдім.", "Я от компании Lider Holding."],
    ["clerk", "Tell me your load ID.", "Лоуд ID'иңди айт.", "Лоуд ID-іңді айт.", "Скажи свой load ID."],
    ["me", "2 0 0 2 4 5 6.", "2002456.", "2002456.", "2002456."],
    ["clerk", "Are you a team driver or solo?", "Команда менен айдайсыңбы же жалгызбы?", "Командамен жүргізесің бе, жалғыз ба?", "Ты в команде или один?"],
    ["me", "I'm solo.", "Мен жалгызмын.", "Мен жалғызбын.", "Я один."],
    ["clerk", "Show me your driver's license and work permit.", "Праваңды жана work permit'иңди көрсөт.", "Куәлігің мен work permit-іңді көрсет.", "Покажи права и разрешение на работу."],
    ["me", "This is my work permit and my CDL.", "Бул менин work permit'им жана CDL'им.", "Бұл менің work permit-ім және CDL-ім.", "Вот моё разрешение на работу и CDL."],
    ["clerk", "Your trailer is ready. Sign this paper.", "Трейлериң даяр. Бул кагазга кол кой.", "Трейлерің дайын. Осы қағазға қол қой.", "Трейлер готов. Подпиши эту бумагу."],
    ["me", "Do I sign in two places?", "Эки жерге кол коёмбу?", "Екі жерге қол қоямын ба?", "Подписывать в двух местах?"],
    ["clerk", "Yes. Write your company, truck number, and where you're going.", "Ооба. Компанияңды, трак номериңди жана кайда барарыңды жаз.", "Иә. Компанияңды, трак нөміріңді және қайда баратыныңды жаз.", "Да. Напиши компанию, номер трака и куда едешь."],
    ["me", "I'm done. Can I get the bill of lading and the seal?", "Жазып бүттүм. BOL кагазын жана пломбаны бересизби?", "Жазып болдым. BOL қағазы мен пломбаны бересіз бе?", "Я закончил. Дадите BOL и пломбу?"],
    ["clerk", "Yes. Here is your bill of lading, and this is the seal.", "Ооба. Мына BOL'уң, мына пломба.", "Иә. Міне BOL-ың, міне пломба.", "Да. Вот твой BOL, а вот пломба."],
    ["me", "How many pallets is it, and how much does it weigh?", "Бул жүк канча паллет, салмагы канча?", "Бұл жүк неше паллет, салмағы қанша?", "Сколько паллет и какой вес?"],
    ["clerk", "It's 10 pallets, 33,000 pounds.", "10 паллет, 33 000 фунт.", "10 паллет, 33 000 фунт.", "10 паллет, 33 000 фунтов."],
    ["me", "Can you check me out?", "Мени check out кылып койосузбу?", "Мені check out жасап қоясыз ба?", "Оформите мне выезд?"],
    ["clerk", "Give me your paperwork. Have a safe trip.", "Кагаздарыңды бер. Ак жол!", "Қағаздарыңды бер. Ақ жол!", "Дай документы. Счастливого пути!"]
  ]},
  { photo:"img/dock.jpg", en:"FedEx / UPS: delivery", title:["FedEx / UPS: жүк тапшыруу", "FedEx / UPS: жүк тапсыру", "FedEx / UPS: доставка"], lines:[
    ["me", "Good evening. I brought a load. I need to drop it.", "Кутман кеч. Жүк алып келдим, таштап кетишим керек.", "Қайырлы кеш. Жүк әкелдім, тастап кетуім керек.", "Добрый вечер. Привёз груз, нужно оставить."],
    ["clerk", "Did you slide the trailer tandems all the way back?", "Трейлердин тандемин толук артка жылдырдыңбы?", "Трейлер тандемін толық артқа жылжыттың ба?", "Ты сдвинул тандем трейлера до конца назад?"],
    ["me", "Sorry, I forgot.", "Кечиресиз, унутуп калыпмын.", "Кешіріңіз, ұмытып кетіппін.", "Извините, забыл."],
    ["clerk", "No problem. Slide the tandems all the way back.", "Эч нерсе эмес. Тандемди толук артка жылдыр.", "Ештеңе етпейді. Тандемді толық артқа жылжыт.", "Ничего. Сдвинь тандем до конца назад."],
    ["me", "Okay, I'm done.", "Макул, жылдырып бүттүм.", "Жарайды, жылжытып болдым.", "Хорошо, сдвинул."],
    ["clerk", "Put the trailer at DD 105, then unhook and disconnect the lines.", "Трейлерди DD 105ке коюп, тракты ажыратып, шлангдарды чеч.", "Трейлерді DD 105-ке қойып, тракты ажыратып, шлангтарды ағыт.", "Поставь трейлер к DD 105, отцепись и отсоедини шланги."],
    ["me", "Should I cut the seal?", "Пломбаны кесейинби?", "Пломбаны кесейін бе?", "Срезать пломбу?"],
    ["clerk", "No, don't cut the seal. Leave it as it is.", "Жок, пломбаны кеспе. Ошол бойдон калтыр.", "Жоқ, пломбаны кеспе. Сол күйінде қалдыр.", "Нет, не срезай пломбу. Оставь как есть."],
    ["me", "Okay. Can you sign my paperwork?", "Макул. Кагазыма кол коюп бересизби?", "Жарайды. Қағазыма қол қойып бересіз бе?", "Хорошо. Подпишете мои документы?"]
  ]},
  { photo:"img/d2/02.jpg", en:"Amazon: early arrival, empty pickup", title:["Amazon: эрте келдим, бош трейлер", "Amazon: ерте келдім, бос трейлер", "Amazon: рано, забор пустого"], lines:[
    ["me", "Hi, how are you doing? Do you work here?", "Салам, кандайсыз? Бул жерде иштейсизби?", "Сәлем, қалайсыз? Осында жұмыс істейсіз бе?", "Привет, как дела? Вы здесь работаете?"],
    ["me", "Which way is the truck entrance?", "Трак кире турган жер кайсы жакта?", "Трак кіретін жер қай жақта?", "Где въезд для траков?"],
    ["me", "Hi, can you check me in?", "Салам, мени каттап (check in) койосузбу?", "Сәлем, мені тіркеп (check in) қоясыз ба?", "Привет, можете меня зарегистрировать (check in)?"],
    ["me", "I'm dropping a loaded trailer and picking up an empty.", "Жүктүү трейлерди таштап, бош трейлер алып кетем.", "Жүкті трейлерді тастап, бос трейлер алып кетемін.", "Сдаю гружёный трейлер и забираю пустой."],
    ["mgr", "Yes. Tell me your load ID.", "Ооба. Лоуд ID'иңди айт.", "Иә. Лоуд ID-іңді айт.", "Да. Скажи свой load ID."],
    ["mgr", "You're early. Please come back in three hours.", "Эрте келипсиз. Үч сааттан кийин келиңиз.", "Ерте келіпсіз. Үш сағаттан кейін келіңіз.", "Вы рано. Приезжайте через три часа."],
    ["me", "Okay, thank you.", "Макул, рахмат.", "Жарайды, рахмет.", "Хорошо, спасибо."],
    ["me", "I'm back. Can you check me in?", "Мен келдим. Мени каттап койосузбу?", "Мен келдім. Мені тіркеп қоясыз ба?", "Я вернулся. Зарегистрируете меня?"],
    ["mgr", "Are you picking up an empty or a loaded trailer?", "Бош трейлер аласыңбы же жүктүүнүбү?", "Бос трейлер аласың ба, жүктісін бе?", "Забираешь пустой или гружёный трейлер?"],
    ["me", "I'm picking up an empty trailer.", "Бош трейлер алып кетем.", "Бос трейлер алып кетемін.", "Забираю пустой трейлер."],
    ["mgr", "What's your load ID?", "Лоуд ID'иң кайсы?", "Лоуд ID-ің қандай?", "Какой у тебя load ID?"],
    ["me", "My load ID is W7DM6.", "Менин лоуд ID'им — W7DM6.", "Менің лоуд ID-ім — W7DM6.", "Мой load ID — W7DM6."],
    ["mgr", "You're checked in. Pick up your trailer from PS 301.", "Катталдың. Трейлериңди PS 301ден ал.", "Тіркелдің. Трейлеріңді PS 301-ден ал.", "Ты зарегистрирован. Забери трейлер с PS 301."],
    ["me", "Excuse me, do you know where the exit is?", "Кечиресиз, чыгуу кайсы жакта экенин билесизби?", "Кешіріңіз, шығу қай жақта екенін білесіз бе?", "Извините, не подскажете, где выезд?"],
    ["me", "Can you check me out? It's an empty trailer.", "Мени чыгарып (check out) койосузбу? Бош трейлер.", "Мені шығарып (check out) қоясыз ба? Бос трейлер.", "Оформите выезд (check out)? Трейлер пустой."],
    ["mgr", "What's the trailer number?", "Трейлердин номери кандай?", "Трейлердің нөмірі қандай?", "Какой номер трейлера?"],
    ["me", "Trailer number HV23040.", "Трейлердин номери HV23040.", "Трейлер нөмірі HV23040.", "Номер трейлера HV23040."]
  ]},
  { photo:"img/amazon.jpg", en:"Amazon: delivering a loaded trailer", title:["Amazon: жүктүү трейлер алып келдим", "Amazon: жүкті трейлер әкелдім", "Amazon: привёз гружёный трейлер"], lines:[
    ["me", "Can you check me in, please?", "Мени каттап койчу.", "Мені тіркеп қойшы.", "Зарегистрируйте меня, пожалуйста."],
    ["mgr", "Is it an empty or a loaded trailer?", "Трейлер бошпу же жүктүүбү?", "Трейлер бос па, жүкті ме?", "Трейлер пустой или гружёный?"],
    ["me", "It's a loaded trailer.", "Жүктүү трейлер.", "Жүкті трейлер.", "Гружёный трейлер."],
    ["me", "Should I put the trailer at dock door 100 or in parking slip 200?", "Трейлерди док эшигине (DD 100) коёмбу же паркинг слипке (PS 200)?", "Трейлерді док есігіне (DD 100) қоям ба, паркинг слипке (PS 200) ме?", "Ставить трейлер к доку DD 100 или на парковку PS 200?"],
    ["mgr", "Put this trailer at DD 101.", "Бул трейлерди DD 101ге кой.", "Бұл трейлерді DD 101-ге қой.", "Поставь этот трейлер к DD 101."],
    ["mgr", "Cut the seal and open the doors.", "Пломбаны кесип, эшиктерди ач.", "Пломбаны кесіп, есіктерді аш.", "Срежь пломбу и открой двери."],
    ["me", "Got it, thank you. Where is the restroom?", "Түшүндүм, рахмат. Ажаткана кайда?", "Түсіндім, рахмет. Дәретхана қайда?", "Понял, спасибо. Где туалет?"],
    ["mgr", "The restroom is through the door between 106 and 107.", "Ажаткана 106 менен 107нин ортосундагы эшиктен кирет.", "Дәретхана 106 мен 107-нің арасындағы есіктен.", "Туалет — через дверь между 106 и 107."],
    ["me", "Thank you. Have a nice day.", "Рахмат, күнүңүз жакшы өтсүн.", "Рахмет, күніңіз жақсы өтсін.", "Спасибо, хорошего дня."]
  ]},
  { photo:"img/d2/09.jpg", en:"Weigh station: inspector", title:["Тараза: инспектор","Таразы: инспектор","Весовая: инспектор"], lines:[
    ["officer","Good morning. License and registration.","Саламатсызбы. Права жана техпаспорт.","Сәлеметсіз бе. Куәлік және техпаспорт.","Доброе утро. Права и техпаспорт."],
    ["me","Good morning, sir. Here you go.","Саламатсызбы. Мына.","Сәлеметсіз бе. Міне.","Доброе утро. Вот, пожалуйста."],
    ["officer","Where are you going?","Кайда бара жатасың?","Қайда бара жатырсың?","Куда едешь?"],
    ["me","To Dallas, Texas.","Даллас, Техаска.","Даллас, Техасқа.","В Даллас, Техас."],
    ["officer","What are you hauling?","Эмне ташып жатасың?","Не тасып жатырсың?","Что везёшь?"],
    ["me","General freight. Here is the bill of lading.","Жалпы жүк. Мына кагазы.","Жалпы жүк. Міне құжаты.","Общий груз. Вот накладная."],
    ["officer","Show me your logbook.","Логбукуңду көрсөт.","Логбугыңды көрсет.","Покажи логбук."],
    ["me","Sure, it's on the ELD.","Мына, ELDде.","Міне, ELD-де.","Вот, в ELD."],
    ["officer","Okay. Drive safe.","Болду. Аман жет.","Болды. Аман жет.","Всё. Счастливого пути."],
    ["me","Thank you, sir.","Рахмат, мырза.","Рахмет, мырза.","Спасибо, сэр."]
  ]},
  { photo:"img/d2/10.jpg", en:"Warehouse: pickup", title:["Склад: жүк алуу","Қойма: жүк алу","Склад: забор груза"], lines:[
    ["clerk","Pickup or delivery?","Алуубу же тапшыруубу?","Алу ма, әлде тапсыру ма?","Забор или доставка?"],
    ["me","Pickup. My appointment is at ten.","Алуу. Убактым саат ондо.","Алу. Уақытым сағат онда.","Забор. Моё время — в десять."],
    ["clerk","What's your pickup number?","Номериң кайсы?","Нөміріңіз қандай?","Какой номер заказа?"],
    ["me","4 5 7 2 1.","4-5-7-2-1.","4-5-7-2-1.","4-5-7-2-1."],
    ["clerk","Back into door 8.","8-эшикке арты менен кир.","8-есікке артымен кір.","Сдай задом к воротам 8."],
    ["me","How long will it take?","Канча убакыт кетет?","Қанша уақыт кетеді?","Сколько это займёт?"],
    ["clerk","About two hours.","Эки саатча.","Екі сағаттай.","Часа два."],
    ["me","Okay. Please call me when it's ready.","Макул. Даяр болсо чалып коюңуз.","Жарайды. Дайын болса хабарласыңыз.","Хорошо. Позвоните, когда будет готово."]
  ]},
  { photo:"img/d2/01.jpg", en:"Police stop: speeding", title:["Полиция: ылдамдык","Полиция: жылдамдық","Полиция: превышение"], lines:[
    ["officer","Good afternoon. Do you know why I stopped you?","Кутман күн. Эмне үчүн токтотконумду билесиңби?","Қайырлы күн. Неге тоқтатқанымды білесің бе?","Добрый день. Знаешь, почему я тебя остановил?"],
    ["me","No, officer. Why?","Жок, мырза. Эмне үчүн?","Жоқ, мырза. Неге?","Нет, офицер. Почему?"],
    ["officer","You were going 68 in a 55 zone.","55 болгон жерде 68 менен жүрдүң.","55 жерде 68-бен жүрдің.","Ты ехал 68 в зоне 55."],
    ["me","I'm sorry. I didn't see the sign.","Кечиресиз. Белгини көрбөй калыпмын.","Кешіріңіз. Белгіні көрмей қалыппын.","Извините. Я не заметил знак."],
    ["officer","License, registration and insurance, please.","Права, техпаспорт жана страховка.","Куәлік, техпаспорт және сақтандыру.","Права, техпаспорт и страховка."],
    ["me","Here you go.","Мына, алыңыз.","Міне, алыңыз.","Вот, пожалуйста."],
    ["officer","Wait in the truck. I'll be right back.","Тракта күтө тур. Азыр келем.","Тракта күте тұр. Қазір келемін.","Подожди в траке. Сейчас вернусь."],
    ["officer","I'm giving you a warning today. Slow down.","Бүгүн эскертүү гана берем. Жай жүр.","Бүгін тек ескерту беремін. Баяу жүр.","Сегодня только предупреждение. Сбавь скорость."],
    ["me","Thank you, officer. I will.","Рахмат, мырза. Жай жүрөм.","Рахмет, мырза. Баяу жүремін.","Спасибо, офицер. Буду."]
  ]},
  { photo:"img/d2/02.jpg", en:"Amazon gate check-in", title:["Amazon дарбазасы","Amazon қақпасы","Въезд на Amazon"], lines:[
    ["guard","Hi. Are you dropping or picking up?","Салам. Таштайсыңбы же аласыңбы?","Сәлем. Тастайсың ба, аласың ба?","Привет. Сдаёшь или забираешь?"],
    ["me","I'm dropping a loaded trailer.","Жүктүү трейлерди таштайм.","Жүкті трейлерді тастаймын.","Сдаю гружёный трейлер."],
    ["guard","What's your VRID?","VRID номериң кайсы?","VRID нөмірің қандай?","Какой у тебя VRID?"],
    ["me","Here it is on my app.","Мына, тиркемеде турат.","Міне, қосымшада тұр.","Вот, в приложении."],
    ["guard","Trailer number and seal number?","Трейлердин жана пломбанын номери?","Трейлер мен пломба нөмірі?","Номер трейлера и пломбы?"],
    ["me","Trailer 5 3 0 1. Seal 7 7 8 2.","Трейлер 5301. Пломба 7782.","Трейлер 5301. Пломба 7782.","Трейлер 5301. Пломба 7782."],
    ["guard","Drop it in spot 214, then pick up an empty in row C.","214-орунга таштап, C катарынан бош трейлер ал.","214-орынға тастап, C қатарынан бос трейлер ал.","Оставь на месте 214, потом возьми пустой в ряду C."],
    ["me","Okay. Spot 214, empty in row C.","Макул. 214-орун, C катарынан бошу.","Жарайды. 214-орын, C қатарынан босы.","Хорошо. Место 214, пустой в ряду C."],
    ["guard","Wear your vest. Speed limit is 5.","Жилетиңди кий. Ылдамдык 5 миля.","Жилетіңді ки. Жылдамдық 5 миль.","Надень жилет. Скорость 5 миль."]
  ]},
  { photo:"img/d2/03.jpg", en:"Call with dispatcher", title:["Диспетчер менен","Диспетчермен","Звонок диспетчеру"], lines:[
    ["disp","Hey, where are you right now?","Салам, азыр кайдасың?","Сәлем, қазір қайдасың?","Привет, ты сейчас где?"],
    ["me","I'm on I-40, near Amarillo.","I-40 жолундамын, Амарилло жакта.","I-40 жолындамын, Амарилло маңында.","На I-40, возле Амарилло."],
    ["disp","How many hours do you have left?","Канча саатың калды?","Қанша сағатың қалды?","Сколько часов осталось?"],
    ["me","About four hours of driving.","Болжол менен төрт саат айдай алам.","Шамамен төрт сағат жүргізе аламын.","Примерно четыре часа вождения."],
    ["disp","I have a load from Oklahoma City to Dallas.","Оклахома-Ситиден Далласка жүк бар.","Оклахома-Ситиден Даллаға жүк бар.","Есть груз из Оклахома-Сити в Даллас."],
    ["me","What time is the pickup?","Жүктү канчада алыш керек?","Жүкті қашан алу керек?","Во сколько забор?"],
    ["disp","Tomorrow at 8 a.m. Can you make it?","Эртең саат 8де. Үлгүрөсүңбү?","Ертең сағат 8-де. Үлгересің бе?","Завтра в 8 утра. Успеешь?"],
    ["me","Yes. Send me the load details, please.","Ооба. Жүктүн маалыматын жибериңиз.","Иә. Жүк мәліметін жіберіңіз.","Да. Пришлите детали груза."],
    ["disp","Sent. Drive safe.","Жибердим. Аман жүр.","Жібердім. Аман жүр.","Отправил. Езжай аккуратно."]
  ]},
  { photo:"img/d2/04.jpg", en:"At the repair shop", title:["Трак шопто","Трак шопта","В трак-шопе"], lines:[
    ["mech","Hi. What's going on with your truck?","Салам. Тракыңа эмне болду?","Сәлем. Тракыңа не болды?","Привет. Что с траком?"],
    ["me","The check engine light is on and it lost power.","Check engine күйүп, күчү азайып калды.","Check engine жанып, қуаты азайды.","Горит check engine и пропала мощность."],
    ["mech","Do you have a fault code?","Ката коду барбы?","Қате коды бар ма?","Есть код ошибки?"],
    ["me","Yes, SPN 3226.","Ооба, SPN 3226.","Иә, SPN 3226.","Да, SPN 3226."],
    ["mech","That's a NOx sensor. We need to run a diagnostic.","Бул NOx датчиги. Диагностика керек.","Бұл NOx датчигі. Диагностика керек.","Это датчик NOx. Нужна диагностика."],
    ["me","How much and how long?","Канча турат жана канча убакыт?","Қанша тұрады және қанша уақыт?","Сколько стоит и сколько по времени?"],
    ["mech","$150 for diagnostic, about two hours.","Диагностика $150, болжол менен эки саат.","Диагностика $150, шамамен екі сағат.","Диагностика $150, около двух часов."],
    ["me","Okay. My company will pay. Here's the PO.","Макул. Компания төлөйт. Мына PO.","Жарайды. Компания төлейді. Міне PO.","Хорошо. Платит компания. Вот PO."],
    ["mech","Great. Leave the keys. We'll call you.","Жакшы. Ачкычты калтыр, чалабыз.","Жақсы. Кілтті қалдыр, хабарласамыз.","Отлично. Оставь ключи, позвоним."]
  ]},
  { photo:"img/d2/05.jpg", en:"Delivery with damage", title:["Бузулган жүк","Бүлінген жүк","Повреждённый груз"], lines:[
    ["clerk","You're unloaded. Two pallets are damaged.","Жүк түшүрүлдү. Эки паллет бузулган.","Жүк түсірілді. Екі паллет бүлінген.","Разгрузили. Два паллета повреждены."],
    ["me","Can I see them?","Көрсөм болобу?","Көрсем бола ма?","Можно посмотреть?"],
    ["clerk","Sure, they're by door 6.","Албетте, 6-эшиктин жанында.","Әрине, 6-есіктің жанында.","Конечно, у ворот 6."],
    ["me","Okay, I'll take pictures.","Макул, сүрөткө тартып алам.","Жарайды, суретке түсіріп аламын.","Хорошо, я сфотографирую."],
    ["me","Please write it on the BOL.","BOLго жазып бериңиз.","BOL-ға жазып беріңіз.","Пожалуйста, отметьте в BOL."],
    ["clerk","I wrote: two pallets damaged, refused.","Жаздым: эки паллет бузулган, кабыл алынган жок.","Жаздым: екі паллет бүлінген, қабылданбады.","Написал: два паллета повреждены, отказ."],
    ["me","Do I take them back?","Аларды кайра алып кетейинби?","Оларды қайта алып кетейін бе?","Мне забрать их обратно?"],
    ["clerk","Yes, they go back on your trailer.","Ооба, трейлериңе кайра жүктөйбүз.","Иә, трейлеріңе қайта тиейміз.","Да, загрузим обратно в трейлер."],
    ["me","Okay. I'll call my dispatcher now.","Макул. Азыр диспетчерге чалам.","Жарайды. Қазір диспетчерге хабарласамын.","Хорошо. Сейчас позвоню диспетчеру."]
  ]},
  { photo:"img/d2/06.jpg", en:"Paying the lumper", title:["Лумперге төлөө","Лумперге төлеу","Оплата грузчикам"], lines:[
    ["clerk","This is a lumper facility. Unloading is $275.","Бул жерде лумпер түшүрөт. Акысы $275.","Мұнда лумпер түсіреді. Ақысы $275.","Здесь разгружают грузчики. $275."],
    ["me","Can I pay with Comchek?","Comchek менен төлөсөм болобу?","Comchek-пен төлесем бола ма?","Можно оплатить Comchek?"],
    ["clerk","Yes. We need the express code.","Ооба. Express код керек.","Иә. Express код керек.","Да. Нужен express-код."],
    ["me","Let me call my dispatcher for the code.","Код үчүн диспетчерге чалайын.","Код үшін диспетчерге хабарласайын.","Позвоню диспетчеру за кодом."],
    ["me","Here is the code: 1 2 3 4 5.","Мына код: 12345.","Міне код: 12345.","Вот код: 12345."],
    ["clerk","Thank you. Here's your receipt.","Рахмат. Мына чегиңиз.","Рахмет. Міне чегіңіз.","Спасибо. Вот ваш чек."],
    ["me","Thanks. How long will unloading take?","Рахмат. Түшүрүү канча убакыт алат?","Рахмет. Түсіру қанша уақыт алады?","Спасибо. Сколько займёт разгрузка?"],
    ["clerk","About an hour and a half.","Бир жарым саатча.","Бір жарым сағаттай.","Около полутора часов."]
  ]},
  { photo:"img/d2/07.jpg", en:"Overweight at the scale", title:["Таразада салмак ашык","Таразыда салмақ артық","Перевес на весах"], lines:[
    ["officer","You're 1,200 pounds over on your tandems.","Тандемдериңде 1200 фунт ашык.","Тандемдеріңде 1200 фунт артық.","Перевес на тандеме 1200 фунтов."],
    ["me","I'm sorry. Can I slide my tandems?","Кечиресиз. Тандемди жылдырсам болобу?","Кешіріңіз. Тандемді жылжытсам бола ма?","Извините. Можно сдвинуть тандем?"],
    ["officer","Yes. Park over there and adjust it.","Ооба. Тигил жакка токтоп, жылдыр.","Иә. Анда тоқтап, жылжыт.","Да. Встань вон там и сдвинь."],
    ["me","How many holes should I move?","Канча тешикке жылдырайын?","Неше тесікке жылжытайын?","На сколько отверстий двигать?"],
    ["officer","Try two holes forward, then come back.","Эки тешик алдыга жылдырып, кайра кел.","Екі тесік алға жылжытып, қайта кел.","Попробуй на два вперёд и заезжай снова."],
    ["me","Okay. I'll be right back.","Макул. Азыр келем.","Жарайды. Қазір келемін.","Хорошо. Сейчас вернусь."],
    ["officer","Now you're legal. You can go.","Эми туура. Кете бер.","Енді дұрыс. Жүре бер.","Теперь всё в норме. Можешь ехать."],
    ["me","Thank you. Have a good day.","Рахмат. Күнүңүз жакшы өтсүн.","Рахмет. Күніңіз жақсы өтсін.","Спасибо. Хорошего дня."]
  ]},
  { photo:"img/d2/08.jpg", en:"Calling road service", title:["Жолдо бузулуу","Жолда бұзылу","Поломка в пути"], lines:[
    ["mech","Road service, how can I help?","Жол жардамы, кантип жардам берейин?","Жол көмегі, қалай көмектесейін?","Техпомощь, чем помочь?"],
    ["me","My truck broke down on I-80.","Тракым I-80де бузулуп калды.","Тракым I-80-де бұзылып қалды.","Мой трак сломался на I-80."],
    ["mech","What's your exact location?","Так кайдасың?","Нақты қайдасың?","Точное местоположение?"],
    ["me","Westbound, mile marker 152, on the shoulder.","Батышка карай, 152-миля, жол четинде.","Батысқа қарай, 152-миля, жол жиегінде.","На запад, 152-я миля, на обочине."],
    ["mech","What's the problem?","Эмне болду?","Не болды?","В чём проблема?"],
    ["me","I have a flat tire on the trailer.","Трейлердин дөңгөлөгү жарылды.","Трейлер дөңгелегі жарылды.","Пробито колесо на трейлере."],
    ["mech","What size is the tire?","Дөңгөлөктүн өлчөмү кандай?","Дөңгелектің өлшемі қандай?","Какой размер шины?"],
    ["me","295/75 R22.5.","295/75 R22.5.","295/75 R22.5.","295/75 R22.5."],
    ["mech","A truck will be there in about an hour.","Бир сааттай убакытта машина барат.","Бір сағаттай уақытта көлік барады.","Машина будет примерно через час."],
    ["me","Thank you. My hazards and triangles are out.","Рахмат. Аварийка күйүп, үч бурчтуктар коюлган.","Рахмет. Авариялық шам жанып, үшбұрыштар қойылған.","Спасибо. Аварийка включена, треугольники стоят."]
  ]},
  { photo:"img/d2/11.jpg", en:"Hotel check-in", title:["Мейманканада","Қонақүйде","В отеле"], lines:[
    ["recep","Good evening. How can I help you?","Кутман кеч. Кантип жардам берейин?","Қайырлы кеш. Қалай көмектесейін?","Добрый вечер. Чем помочь?"],
    ["me","I need a room for one night.","Бир түнгө бөлмө керек.","Бір түнге бөлме керек.","Нужен номер на одну ночь."],
    ["recep","Do you have a reservation?","Брондооңуз барбы?","Броныңыз бар ма?","У вас есть бронь?"],
    ["me","No, I don't.","Жок.","Жоқ.","Нет."],
    ["recep","We have a king room for $89.","$89га бир чоң керебеттүү бөлмө бар.","$89-ға үлкен төсекті бөлме бар.","Есть номер с большой кроватью за $89."],
    ["me","Okay. Is there truck parking?","Макул. Трак коюучу жер барбы?","Жарайды. Трак тұрағы бар ма?","Хорошо. Есть парковка для трака?"],
    ["recep","Yes, in the back lot.","Ооба, арт жакта.","Иә, артқы жақта.","Да, на заднем дворе."],
    ["recep","Can I see your ID and a card?","Документиңизди жана картаңызды көрсөтүңүз.","Құжатыңыз бен картаңызды көрсетіңіз.","Документ и карту, пожалуйста."],
    ["me","Here you go. What time is checkout?","Мына. Чыгуу канчада?","Міне. Шығу қашан?","Вот. Во сколько выезд?"],
    ["recep","11 a.m. Breakfast is 6 to 9.","Таңкы 11де. Эртең мененки тамак 6дан 9га чейин.","Таңғы 11-де. Таңғы ас 6-дан 9-ға дейін.","В 11 утра. Завтрак с 6 до 9."]
  ]},
  { photo:"img/d2/12.jpg", en:"At a restaurant", title:["Ашканада","Асханада","В кафе"], lines:[
    ["waiter","Hi! Table for one?","Салам! Бир кишигеби?","Сәлем! Бір адамға ма?","Привет! Столик на одного?"],
    ["me","Yes, please.","Ооба.","Иә.","Да, пожалуйста."],
    ["waiter","Can I get you something to drink?","Ичимдиктен эмне алып келейин?","Сусыннан не әкелейін?","Что будете пить?"],
    ["me","Coffee, please. Black.","Кофе, кант-сүтсүз.","Кофе, қант-сүтсіз.","Кофе, чёрный."],
    ["waiter","What would you like to eat?","Эмне жейсиз?","Не жейсіз?","Что будете есть?"],
    ["me","The chicken plate with rice, no pork please.","Күрүч менен тоок, чочко эти болбосун.","Күріш пен тауық, шошқа еті болмасын.","Курицу с рисом, без свинины, пожалуйста."],
    ["waiter","Sure. Anything else?","Макул. Дагы бир нерсе?","Жарайды. Тағы бір нәрсе?","Хорошо. Что-нибудь ещё?"],
    ["me","No, thank you. Can I get the check later?","Жок, рахмат. Эсепти кийин бересизби?","Жоқ, рахмет. Шотты кейін бересіз бе?","Нет, спасибо. Счёт потом, пожалуйста."],
    ["waiter","Of course.","Албетте.","Әрине.","Конечно."]
  ]},
  { photo:"img/d2/13.jpg", en:"DOT physical", title:["DOT медкарта","DOT медкарта","Медосмотр DOT"], lines:[
    ["doctor","Hi. Are you here for your DOT physical?","Салам. DOT медтекшерүүгө келдиңизби?","Сәлем. DOT медтексеруге келдіңіз бе?","Здравствуйте. Вы на медосмотр DOT?"],
    ["me","Yes. My medical card expires next week.","Ооба. Медкартамдын мөөнөтү кийинки жумада бүтөт.","Иә. Медкартамның мерзімі келесі аптада бітеді.","Да. Медкарта истекает на следующей неделе."],
    ["doctor","Do you take any medications?","Кандайдыр бир дары ичесизби?","Қандай да бір дәрі ішесіз бе?","Принимаете лекарства?"],
    ["me","No, I don't.","Жок, ичпейм.","Жоқ, ішпеймін.","Нет."],
    ["doctor","Please read the letters on the wall.","Дубалдагы тамгаларды окуңуз.","Қабырғадағы әріптерді оқыңыз.","Прочитайте буквы на стене."],
    ["doctor","Now I'll check your blood pressure.","Эми кан басымыңызды өлчөйм.","Енді қан қысымыңызды өлшеймін.","Теперь измерю давление."],
    ["doctor","Everything looks good. Your card is for two years.","Баары жакшы. Медкартаңыз эки жылга.","Бәрі жақсы. Медкартаңыз екі жылға.","Всё хорошо. Карта на два года."],
    ["me","Thank you, doctor.","Рахмат, доктур.","Рахмет, дәрігер.","Спасибо, доктор."]
  ]},
  { photo:"img/d2/14.jpg", en:"Broker check call", title:["Брокер чалды","Брокер хабарласты","Звонок брокера"], lines:[
    ["broker","Hi, this is Mike from XYZ Logistics. Are you loaded?","Салам, бул XYZ Logistics'тен Майк. Жүктөлдүңбү?","Сәлем, бұл XYZ Logistics-тен Майк. Тиелдің бе?","Привет, это Майк из XYZ Logistics. Загрузился?"],
    ["me","Yes, I loaded at 9 a.m.","Ооба, саат 9да жүктөлдүм.","Иә, сағат 9-да тиелдім.","Да, загрузился в 9 утра."],
    ["broker","Great. What's your ETA to the receiver?","Жакшы. Алуучуга качан жетесиң?","Жақсы. Алушыға қашан жетесің?","Отлично. Когда будешь у получателя?"],
    ["me","Tomorrow around 7 a.m.","Эртең саат 7дерде.","Ертең сағат 7-лерде.","Завтра около 7 утра."],
    ["broker","Can you accept the tracking link?","Трекинг шилтемесин кабыл аласыңбы?","Трекинг сілтемесін қабылдайсың ба?","Можешь принять ссылку на трекинг?"],
    ["me","Yes, send it to my phone.","Ооба, телефонума жибериңиз.","Иә, телефоныма жіберіңіз.","Да, отправьте на телефон."],
    ["broker","Please send the BOL picture too.","BOLдун сүрөтүн да жибер.","BOL суретін де жібер.","Пришли ещё фото BOL."],
    ["me","Okay, sending it now.","Макул, азыр жиберем.","Жарайды, қазір жіберемін.","Хорошо, сейчас отправлю."]
  ]},
  { photo:"img/d2/15.jpg", en:"Flatbed: securing the load", title:["Флэтбед: жүк бекитүү","Флэтбед: жүк бекіту","Площадка: крепление"], lines:[
    ["worker","We're loading two crates. How do you want them?","Эки ящик жүктөйбүз. Кандай койолу?","Екі жәшік тиейміз. Қалай қоялық?","Грузим два ящика. Как ставить?"],
    ["me","Put the heavy one on the lower deck, please.","Оорун ылдыйкы бөлүккө коюңуз.","Ауырын төменгі бөлікке қойыңыз.","Тяжёлый на нижнюю площадку, пожалуйста."],
    ["worker","Okay. Do you have enough straps?","Макул. Ремендериң жетишеби?","Жарайды. Белдіктерің жете ме?","Хорошо. Ремней хватает?"],
    ["me","Yes, I have ten straps and edge protectors.","Ооба, 10 ремень жана бурч коргогучтар бар.","Иә, 10 белдік пен бұрыш қорғағыштар бар.","Да, десять ремней и уголки."],
    ["worker","Do you need a tarp?","Тент керекпи?","Тент керек пе?","Нужен тент?"],
    ["me","The BOL says tarped. I'll tarp it.","BOLдо тент деп жазылган. Жабам.","BOL-да тент деп жазылған. Жабамын.","В BOL указан тент. Накрою."],
    ["worker","How tall is it now?","Азыр бийиктиги канча?","Қазір биіктігі қанша?","Какая сейчас высота?"],
    ["me","About 12 feet 8 inches. That's legal.","12 фут 8 дюймдай. Норма.","12 фут 8 дюймдай. Қалыпты.","Около 12 футов 8 дюймов. В норме."]
  ]},
  { photo:"img/d2/16.jpg", en:"Hotshot pickup", title:["Хотшот жүк алуу","Хотшот жүк алу","Забор хотшот"], lines:[
    ["clerk","You're the hotshot driver?","Сен хотшот айдоочусуңбу?","Сен хотшот жүргізушісің бе?","Ты водитель хотшота?"],
    ["me","Yes. I'm here for the pickup to Houston.","Ооба. Хьюстонго жүк алганы келдим.","Иә. Хьюстонға жүк алуға келдім.","Да. Я за грузом в Хьюстон."],
    ["clerk","It's one pallet, 3,000 pounds.","Бир паллет, 3000 фунт.","Бір паллет, 3000 фунт.","Один паллет, 3000 фунтов."],
    ["me","No problem. Can you load it with a forklift?","Маселе жок. Погрузчик менен коё аласызбы?","Мәселе жоқ. Погрузчикпен қоя аласыз ба?","Без проблем. Погрузите вилочным?"],
    ["clerk","Yes. Pull your trailer to the side.","Ооба. Трейлериңди капталга кой.","Иә. Трейлеріңді бүйірге қой.","Да. Поставь трейлер боком."],
    ["me","Please put it over the axles.","Октордун үстүнө коюңуз.","Осьтердің үстіне қойыңыз.","Поставьте над осями, пожалуйста."],
    ["clerk","Done. Sign here.","Бүттү. Бул жерге кол кой.","Болды. Осы жерге қол қой.","Готово. Распишись здесь."],
    ["me","Thanks. I'll strap it down and go.","Рахмат. Бекитип, жолго чыгам.","Рахмет. Бекітіп, жолға шығамын.","Спасибо. Закреплю и поеду."]
  ]},
  { photo:"img/d2/17.jpg", en:"Oversize load", title:["Негабарит жүк","Габариттен тыс жүк","Негабарит"], lines:[
    ["disp","Your load is oversize. Do you have the permits?","Жүгүң негабарит. Пермиттериң барбы?","Жүгің габариттен тыс. Пермиттерің бар ма?","Груз негабаритный. Есть пермиты?"],
    ["me","Yes, for Texas and Oklahoma.","Ооба, Техас жана Оклахома үчүн.","Иә, Техас пен Оклахома үшін.","Да, на Техас и Оклахому."],
    ["disp","You can only drive in daylight.","Күндүз гана айдасаң болот.","Тек күндіз жүргізуге болады.","Ехать можно только днём."],
    ["me","Understood. Do I need an escort?","Түшүндүм. Коштоочу машина керекпи?","Түсіндім. Алып жүретін көлік керек пе?","Понял. Нужна машина сопровождения?"],
    ["disp","Yes, one escort in the front.","Ооба, алдыда бир коштоочу.","Иә, алдында бір алып жүруші.","Да, одна машина спереди."],
    ["me","Where do I meet the escort?","Коштоочуну кайда тосом?","Алып жүрушіні қай жерде күтемін?","Где встретить сопровождение?"],
    ["disp","At the Love's in Ardmore at 7 a.m.","Ардмордогу Love'с'та, таңкы 7де.","Ардмордағы Love's-та, таңғы 7-де.","На Love's в Ардморе в 7 утра."],
    ["me","Okay. I'll check my flags and lights.","Макул. Желектерди жана чырактарды текшерем.","Жарайды. Жалаушалар мен шамдарды тексеремін.","Хорошо. Проверю флажки и огни."]
  ]},
  { photo:"img/d2/18.jpg", en:"Truck parking is full", title:["Токтотмо толук","Тұрақ толы","Парковка заполнена"], lines:[
    ["cashier","Sorry, the truck parking is full.","Кечиресиз, трак токтотмо толук.","Кешіріңіз, трак тұрағы толы.","Извините, парковка для траков заполнена."],
    ["me","I'm almost out of hours. Is there another place?","Саатым бүтүп калды. Башка жер барбы?","Сағатым бітіп қалды. Басқа орын бар ма?","У меня почти кончились часы. Есть другое место?"],
    ["cashier","There's a rest area 12 miles east.","Чыгышта 12 милде эс алуу жайы бар.","Шығыста 12 мильде демалыс орны бар.","Зона отдыха в 12 милях на восток."],
    ["me","Can I reserve a spot for tomorrow?","Эртеңкиге орун брондосом болобу?","Ертеңге орын брондасам бола ма?","Можно забронировать место на завтра?"],
    ["cashier","Yes, it's $15 in the app.","Ооба, тиркемеде $15.","Иә, қосымшада $15.","Да, в приложении $15."],
    ["me","Okay, thank you for your help.","Макул, жардамыңыз үчүн рахмат.","Жарайды, көмегіңізге рахмет.","Хорошо, спасибо за помощь."]
  ]},
  { photo:"img/d2/19.jpg", en:"Reefer temperature problem", title:["Рефка температурасы","Рефка температурасы","Проблема с рефом"], lines:[
    ["clerk","Your load is at 42 degrees. It should be 34.","Жүгүң 42 градус. 34 болушу керек эле.","Жүгің 42 градус. 34 болуы керек еді.","Груз при 42 градусах. Должно быть 34."],
    ["me","My reefer was set to 34 the whole time.","Рефкам бою 34кө коюлган.","Рефкам бойы 34-ке қойылған.","Реф всё время стоял на 34."],
    ["clerk","Can you print a download from the unit?","Агрегаттан маалымат басып чыгара аласыңбы?","Агрегаттан деректі басып шығара аласың ба?","Можешь распечатать отчёт с агрегата?"],
    ["me","Yes, I'll send it to my company now.","Ооба, азыр компанияга жиберем.","Иә, қазір компанияға жіберемін.","Да, сейчас отправлю компании."],
    ["clerk","We need to call the shipper first.","Адегенде жүк ээсине чалышыбыз керек.","Алдымен жүк иесіне хабарласуымыз керек.","Сначала позвоним отправителю."],
    ["me","Okay. Please don't reject it before we check.","Макул. Текшермейинче кайтарбаңыз.","Жарайды. Тексермейінше қайтармаңыз.","Хорошо. Не отказывайтесь, пока не проверим."],
    ["clerk","We'll wait for the download.","Маалыматты күтөбүз.","Деректі күтеміз.","Ждём отчёт."]
  ]},
  { photo:"img/d2/20.jpg", en:"Fuel desk and shower", title:["Заправкада: солярка жана душ","Жанармай: дизель және душ","На заправке: топливо и душ"], lines:[
    ["cashier","Hi. What pump are you on?","Салам. Кайсы колонкадасыз?","Сәлем. Қай колонкадасыз?","Привет. На какой колонке?"],
    ["me","Pump 9. I want to fill up diesel and DEF.","9-колонка. Солярка менен DEF толтургум келет.","9-колонка. Дизель мен DEF толтырғым келеді.","Колонка 9. Залить дизель и DEF до полного."],
    ["cashier","Okay. Do you have a rewards card?","Макул. Бонус картаңыз барбы?","Жарайды. Бонус картаңыз бар ма?","Хорошо. Есть бонусная карта?"],
    ["me","Yes, here. Can I also get a shower?","Ооба, мына. Душ да алсам болобу?","Иә, міне. Душ та алсам бола ма?","Да, вот. И можно душ?"],
    ["cashier","Sure. You have a free shower with this fuel.","Албетте. Ушул солярка менен душ бекер.","Әрине. Осы дизельмен душ тегін.","Конечно. С этой заправкой душ бесплатно."],
    ["cashier","Your shower number will be on the screen.","Душ номериңиз экранда чыгат.","Душ нөміріңіз экранда шығады.","Номер душа появится на экране."],
    ["me","Thank you. How long is the wait?","Рахмат. Канча күтөм?","Рахмет. Қанша күтемін?","Спасибо. Сколько ждать?"],
    ["cashier","About 20 minutes.","20 мүнөттөй.","20 минуттай.","Около 20 минут."]
  ]},
  { photo:"img/d2/21.jpg", en:"At the truck wash", title:["Трак жуучу жайда","Трак жуу орнында","На мойке траков"], lines:[
    ["worker","Hi. Tractor only or tractor and trailer?","Салам. Тягач гана бы же трейлер менен?","Сәлем. Тек тягач па, трейлермен бе?","Привет. Только тягач или с прицепом?"],
    ["me","Tractor and trailer, please.","Тягач жана трейлер.","Тягач пен трейлер.","Тягач и прицеп, пожалуйста."],
    ["worker","Do you want the inside of the trailer washed too?","Трейлердин ичин да жуубузбу?","Трейлердің ішін де жуайық па?","Внутри прицепа тоже помыть?"],
    ["me","Yes, I need a washout. It must be clean for food.","Ооба, ичин жуу керек. Тамак-аш үчүн таза болушу керек.","Иә, ішін жуу керек. Тамақ үшін таза болуы керек.","Да, нужна мойка внутри. Под продукты."],
    ["worker","That's $95 total. It takes 30 minutes.","Баары $95. 30 мүнөт кетет.","Барлығы $95. 30 минут кетеді.","Всего $95. Займёт 30 минут."],
    ["me","Can I get a washout receipt?","Жуулганы тууралуу чек бересизби?","Жуылғаны туралы чек бересіз бе?","Дадите чек на мойку внутри?"],
    ["worker","Yes, we'll give you a washout ticket.","Ооба, атайын талон беребиз.","Иә, арнайы талон береміз.","Да, дадим талон."]
  ]},
  { photo:"img/weigh.jpg", en:"Weighing at a CAT scale", title:["CAT таразада","CAT таразыда","Весы CAT"], lines:[
    ["me","Hi, I want to weigh my truck.","Салам, тракымды таразалагым келет.","Сәлем, тракымды өлшегім келеді.","Здравствуйте, хочу взвесить трак."],
    ["cashier","Is this your first weigh or a reweigh?","Биринчи жолубу же кайра таразалоо?","Бірінші рет пе, қайта өлшеу ме?","Первое взвешивание или повторное?"],
    ["me","First weigh.","Биринчи жолу.","Бірінші рет.","Первое."],
    ["cashier","Pull onto the scale and press the button.","Таразага чыгып, баскычты бас.","Таразыға шығып, батырманы бас.","Заезжай на весы и нажми кнопку."],
    ["me","My drives are at 34,500. Is that okay?","Драйв окторум 34 500. Бул туурабы?","Драйв осьтерім 34 500. Бұл дұрыс па?","Ведущие 34 500. Это нормально?"],
    ["cashier","The limit is 34,000. Slide your fifth wheel back.","Чеги 34 000. Седлону артка жылдыр.","Шегі 34 000. Седлоны артқа жылжыт.","Лимит 34 000. Сдвинь седло назад."],
    ["me","Okay. A reweigh is cheaper, right?","Макул. Кайра таразалоо арзаныраакпы?","Жарайды. Қайта өлшеу арзанырақ па?","Хорошо. Повторное дешевле, да?"],
    ["cashier","Yes, it's only three dollars.","Ооба, болгону үч доллар.","Иә, бар-жоғы үш доллар.","Да, всего три доллара."]
  ]},
  { photo:"img/d2/22.jpg", en:"Tire shop", title:["Дөңгөлөк оңдоо","Дөңгелек жөндеу","Шиномонтаж"], lines:[
    ["mech","What can I do for you?","Эмне кылып берейин?","Не істеп берейін?","Чем помочь?"],
    ["me","My right steer tire is losing air.","Оң алдыңкы дөңгөлөгүмдөн аба чыгып жатат.","Оң алдыңғы дөңгелегімнен ауа шығып жатыр.","Правое рулевое колесо травит воздух."],
    ["mech","Let me check it. Yes, there's a nail.","Карайын. Ооба, мык бар экен.","Қарайын. Иә, шеге бар екен.","Сейчас посмотрю. Да, гвоздь."],
    ["me","Can you patch it?","Жамап бересизби?","Жамап бересіз бе?","Можно залатать?"],
    ["mech","Not on a steer tire. You need a new one.","Алдыңкы дөңгөлөктү жамаганга болбойт. Жаңы керек.","Алдыңғы дөңгелекті жамауға болмайды. Жаңа керек.","Рулевую нельзя латать. Нужна новая."],
    ["me","How much is a new steer tire?","Жаңысы канча турат?","Жаңасы қанша тұрады?","Сколько стоит новая?"],
    ["mech","About $550 with mounting.","Орнотуу менен $550дөй.","Орнатумен $550-дей.","Около $550 с монтажом."],
    ["me","Okay. Let me call my company for approval.","Макул. Компаниядан уруксат сурайын.","Жарайды. Компаниядан рұқсат сұрайын.","Хорошо. Позвоню компании за одобрением."]
  ]},
  { photo:"img/d2/23.jpg", en:"Oil change", title:["Май алмаштыруу","Май ауыстыру","Замена масла"], lines:[
    ["mech","Welcome to Speedco. What do you need today?","Speedco'го кош келиңиз. Бүгүн эмне керек?","Speedco-ға қош келдіңіз. Бүгін не керек?","Добро пожаловать в Speedco. Что нужно?"],
    ["me","An oil change and a DOT inspection.","Май алмаштыруу жана DOT текшерүү.","Май ауыстыру және DOT тексеру.","Замена масла и DOT-техосмотр."],
    ["mech","What's your mileage?","Пробегиңиз канча?","Жүрісіңіз қанша?","Какой пробег?"],
    ["me","About 410,000 miles.","410 000 миляга жакын.","410 000 мильге жуық.","Около 410 000 миль."],
    ["mech","Do you want us to grease the fifth wheel too?","Седлону да майлайлыбы?","Седлоны да майлайық па?","Седло тоже смазать?"],
    ["me","Yes, please. And check the air filter.","Ооба. Аба фильтрин да текшериңиз.","Иә. Ауа сүзгісін де тексеріңіз.","Да. И проверьте воздушный фильтр."],
    ["mech","It'll be ready in about an hour.","Бир сааттан кийин даяр болот.","Бір сағатта дайын болады.","Будет готово примерно через час."]
  ]},
  { photo:"img/d2/24.jpg", en:"Brakes out of adjustment", title:["Тормоз жөндөлбөгөн","Тежегіш реттелмеген","Тормоза не отрегулированы"], lines:[
    ["officer","Your brakes on axle four are out of adjustment.","Төртүнчү октун тормозу жөндөлбөгөн.","Төртінші осьтің тежегіші реттелмеген.","Тормоза на четвёртой оси не отрегулированы."],
    ["me","I'm sorry. Can I adjust them here?","Кечиресиз. Ушул жерде жөндөсөм болобу?","Кешіріңіз. Осы жерде реттесем бола ма?","Извините. Можно отрегулировать здесь?"],
    ["officer","Yes, if you have the tools.","Ооба, аспаптарың болсо.","Иә, құралдарың болса.","Да, если есть инструмент."],
    ["me","I have a wrench. It will take ten minutes.","Ачкычым бар. 10 мүнөт кетет.","Кілтім бар. 10 минут кетеді.","Ключ есть. Займёт десять минут."],
    ["officer","Okay. Let me know when you're done.","Макул. Бүткөндө айт.","Жарайды. Біткенде айт.","Хорошо. Скажи, когда закончишь."],
    ["me","Done. Can you check again?","Бүттү. Кайра текшересизби?","Болды. Қайта тексересіз бе?","Готово. Проверите ещё раз?"],
    ["officer","Good. You're free to go.","Жакшы. Кете бер.","Жақсы. Жүре бер.","Хорошо. Можешь ехать."]
  ]},
  { photo:"img/d2/25.jpg", en:"Light out at night", title:["Түнкү чырак","Түнгі шам","Не горит фонарь"], lines:[
    ["officer","Your left tail light is out.","Сол арткы чырагың күйбөйт.","Сол артқы шамың жанбайды.","У тебя не горит левый задний фонарь."],
    ["me","Thank you for telling me. I didn't know.","Айтканыңызга рахмат. Билген эмесмин.","Айтқаныңызға рахмет. Білмеппін.","Спасибо, что сказали. Я не знал."],
    ["officer","Do you have a spare bulb?","Запас лампочкаң барбы?","Қосалқы шамың бар ма?","Есть запасная лампа?"],
    ["me","Yes, I can change it now.","Ооба, азыр алмаштырам.","Иә, қазір ауыстырамын.","Да, сейчас поменяю."],
    ["officer","Okay. Turn on your lights so I can check.","Макул. Чырактарды күйгүз, текшерейин.","Жарайды. Шамдарды қос, тексерейін.","Хорошо. Включи свет, я проверю."],
    ["officer","It works now. Have a safe night.","Эми күйөт. Түнүң тынч өтсүн.","Енді жанады. Түнің тыныш өтсін.","Теперь горит. Спокойной ночи."]
  ]},
  { photo:"img/city.jpg", en:"Police: no turn signal", title:["Полиция: поворот бербедиң","Полиция: белгі бермедің","Полиция: без поворотника"], lines:[
    ["officer","You changed lanes without a signal.","Поворот бербей тилке алмаштырдың.","Белгі бермей жолақ ауыстырдың.","Ты перестроился без поворотника."],
    ["me","I'm sorry, officer. It was my mistake.","Кечиресиз, мырза. Менин катам.","Кешіріңіз, мырза. Менің қатем.","Извините, офицер. Моя ошибка."],
    ["officer","Is your signal working?","Поворотуң иштейби?","Бұрылыс шамың жұмыс істей ме?","Поворотник работает?"],
    ["me","Yes, it works. I forgot to use it.","Ооба, иштейт. Күйгүзүүнү унутуп калдым.","Иә, жұмыс істейді. Қосуды ұмытып кеттім.","Да, работает. Забыл включить."],
    ["officer","I'm writing you a ticket. You can pay online.","Айып жазам. Онлайн төлөсөң болот.","Айыппұл жазамын. Онлайн төлеуге болады.","Выписываю штраф. Оплатить можно онлайн."],
    ["me","Okay. Where is the website?","Макул. Сайты кайда жазылган?","Жарайды. Сайты қайда жазылған?","Хорошо. Где адрес сайта?"],
    ["officer","It's on the back of the ticket.","Айып кагазынын артында.","Айыппұл қағазының артында.","На обороте штрафа."]
  ]},
  { photo:"img/city.jpg", en:"Police: using the phone", title:["Полиция: телефон","Полиция: телефон","Полиция: телефон"], lines:[
    ["officer","I saw you holding your phone while driving.","Айдап баратып телефон кармаганыңды көрдүм.","Жүргізіп бара жатып телефон ұстағаныңды көрдім.","Я видел, ты держал телефон за рулём."],
    ["me","I was looking at my GPS.","GPSти карап жаткам.","GPS-ке қарап тұрдым.","Я смотрел в GPS."],
    ["officer","Truck drivers can't hold a phone. Use a mount.","Айдоочулар телефонду колго кармабайт. Кармагычка кой.","Жүргізушілер телефонды қолға ұстамайды. Ұстағышқа қой.","Водителям нельзя держать телефон. Используй держатель."],
    ["me","I understand. I'll buy a mount today.","Түшүндүм. Бүгүн кармагыч сатып алам.","Түсіндім. Бүгін ұстағыш сатып аламын.","Понял. Сегодня куплю держатель."],
    ["officer","This is a serious violation. Here is your citation.","Бул олуттуу бузуу. Мына айып кагазың.","Бұл ауыр бұзушылық. Міне айыппұл қағазың.","Это серьёзное нарушение. Вот штраф."],
    ["me","Thank you, officer.","Рахмат, мырза.","Рахмет, мырза.","Спасибо, офицер."]
  ]},
  { photo:"img/d2/26.jpg", en:"Work zone flagger", title:["Жол оңдоодо желекчен","Жол жөндеуде жалаушашы","Регулировщик на ремонте"], lines:[
    ["worker","Stop here, please. One lane only ahead.","Бул жерде токто. Алдыда бир гана тилке.","Осында тоқта. Алда бір ғана жолақ.","Остановись здесь. Впереди одна полоса."],
    ["me","How long is the wait?","Канча күтөм?","Қанша күтемін?","Сколько ждать?"],
    ["worker","About ten minutes. Wait for the pilot car.","10 мүнөттөй. Коштоочу машинаны күт.","10 минуттай. Алып жүретін көлікті күт.","Минут десять. Жди машину сопровождения."],
    ["me","Can my truck fit through? It's 13 feet 6 inches.","Тракым батабы? Бийиктиги 13 фут 6 дюйм.","Тракым сыя ма? Биіктігі 13 фут 6 дюйм.","Трак пройдёт? Высота 13 футов 6 дюймов."],
    ["worker","Yes, no problem. Follow the pilot car slowly.","Ооба, маселе жок. Коштоочуну жай ээрчи.","Иә, мәселе жоқ. Алып жүрушіге баяу ер.","Да, без проблем. Езжай медленно за ним."],
    ["me","Okay, thank you.","Макул, рахмат.","Жарайды, рахмет.","Хорошо, спасибо."]
  ]},
  { photo:"img/d2/27.jpg", en:"Early at the shipper", title:["Жүккө эрте келдим","Жүкке ерте келдім","Рано у отправителя"], lines:[
    ["clerk","Your appointment is at 2 p.m. It's only 10.","Убактыңыз түшкү 2де. Азыр 10 гана.","Уақытыңыз түскі 2-де. Қазір 10 ғана.","Запись на 14:00. Сейчас только 10."],
    ["me","I know. Can you load me early?","Билем. Эртерээк жүктөп бересизби?","Білемін. Ертерек тиеп бересіз бе?","Знаю. Можете загрузить раньше?"],
    ["clerk","Maybe. If a door opens, we'll call you.","Балким. Эшик бошосо, чалабыз.","Мүмкін. Есік босаса, хабарласамыз.","Может быть. Если ворота освободятся — позвоним."],
    ["me","Thank you. Here's my phone number.","Рахмат. Мына телефон номерим.","Рахмет. Міне телефон нөмірім.","Спасибо. Вот мой номер."],
    ["clerk","Where are you parked?","Кайда токтоп турасыз?","Қайда тұрсыз?","Где ты стоишь?"],
    ["me","In the waiting area, spot 4.","Күтүү аймагында, 4-орунда.","Күту аймағында, 4-орында.","В зоне ожидания, место 4."],
    ["clerk","Okay. Stay close to your phone.","Макул. Телефонуңду жаныңда карма.","Жарайды. Телефоныңды жаныңда ұста.","Хорошо. Будь на телефоне."]
  ]},
  { photo:"img/dock.jpg", en:"Late for the appointment", title:["Убакытка кечиктим","Уақытқа кешіктім","Опоздал на запись"], lines:[
    ["clerk","You're two hours late.","Эки саатка кечиктиңиз.","Екі сағатқа кешіктіңіз.","Ты опоздал на два часа."],
    ["me","I'm sorry. There was an accident on the highway.","Кечиресиз. Трассада авария болду.","Кешіріңіз. Трассада апат болды.","Извините. На трассе была авария."],
    ["clerk","We can't load you today.","Бүгүн жүктөй албайбыз.","Бүгін тией алмаймыз.","Сегодня не сможем загрузить."],
    ["me","Is there any way you can work me in?","Кандайдыр бир жол менен кошо албайсызбы?","Қандай да бір жолмен қоса алмайсыз ба?","Может, как-то втиснете?"],
    ["clerk","Let me ask my supervisor.","Жетекчимден сурайын.","Басшымнан сұрайын.","Спрошу у начальника."],
    ["clerk","Okay, we can load you at 8 p.m.","Макул, кечки 8де жүктөйбүз.","Жарайды, кешкі 8-де тиейміз.","Хорошо, загрузим в 20:00."],
    ["me","Thank you very much. I'll wait.","Чоң рахмат. Күтөм.","Үлкен рахмет. Күтемін.","Большое спасибо. Подожду."]
  ]},
  { photo:"img/d2/28.jpg", en:"First come, first served", title:["Кезек менен","Кезекпен","Живая очередь"], lines:[
    ["me","Hi. Do I need an appointment here?","Салам. Бул жерге убакыт алуу керекпи?","Сәлем. Мұнда уақыт алу керек пе?","Привет. Здесь нужна запись?"],
    ["clerk","No, we're first come, first served.","Жок, бизде кезек менен.","Жоқ, бізде кезекпен.","Нет, у нас живая очередь."],
    ["me","How many trucks are ahead of me?","Менден мурун канча трак бар?","Менен бұрын қанша трак бар?","Сколько траков передо мной?"],
    ["clerk","Five trucks. About three hours.","Беш трак. Үч сааттай.","Бес трак. Үш сағаттай.","Пять траков. Около трёх часов."],
    ["me","Is there a restroom for drivers?","Айдоочулар үчүн ажаткана барбы?","Жүргізушілерге дәретхана бар ма?","Есть туалет для водителей?"],
    ["clerk","Yes, next to the office.","Ооба, кеңсенин жанында.","Иә, кеңсенің жанында.","Да, рядом с офисом."]
  ]},
  { photo:"img/d2/29.jpg", en:"Count is short", title:["Жүк жетишпейт","Жүк жетпейді","Недостача"], lines:[
    ["clerk","The BOL says 24 pallets. I only count 23.","BOLдо 24 паллет. Мен 23 эле санадым.","BOL-да 24 паллет. Мен 23-ін ғана санадым.","В BOL 24 паллета. Я насчитал 23."],
    ["me","The shipper loaded it and sealed it.","Жүк ээси жүктөп, пломбалаган.","Жүк иесі тиеп, пломбалаған.","Грузил и пломбировал отправитель."],
    ["me","The BOL says shipper load and count.","BOLдо «shipper load and count» деп жазылган.","BOL-да «shipper load and count» деп жазылған.","В BOL указано «shipper load and count»."],
    ["clerk","Okay. I'll write one pallet short on the BOL.","Макул. BOLго бир паллет жетишпейт деп жазам.","Жарайды. BOL-ға бір паллет жетпейді деп жазамын.","Хорошо. Отмечу недостачу одного паллета."],
    ["me","Please also write that the seal was intact.","Пломба бүтүн болгонун да жазыңыз.","Пломба бүтін болғанын да жазыңыз.","Укажите, что пломба была целой."],
    ["clerk","Sure. Seal intact, one short.","Макул. Пломба бүтүн, бирөө жетишпейт.","Жарайды. Пломба бүтін, біреуі жетпейді.","Да. Пломба целая, одного не хватает."]
  ]},
  { photo:"img/d2/30.jpg", en:"Drop and hook at a DC", title:["Дистрибуция борборунда","Тарату орталығында","На распредцентре"], lines:[
    ["guard","Good morning. What's your load number?","Кутман таң. Жүгүңдүн номери кайсы?","Қайырлы таң. Жүгіңнің нөмірі қандай?","Доброе утро. Номер груза?"],
    ["me","4 4 1 9 2 0. It's a drop and hook.","441920. Таштап, илип кетем.","441920. Тастап, іліп кетемін.","441920. Drop and hook."],
    ["guard","Drop in door 52. Your loaded trailer is in spot 310.","52-эшикке ташта. Жүктүү трейлериң 310-орунда.","52-есікке таста. Жүкті трейлерің 310-орында.","Оставь у ворот 52. Гружёный трейлер на месте 310."],
    ["me","Is it sealed and ready?","Пломбаланган, даярбы?","Пломбаланған, дайын ба?","Опломбирован и готов?"],
    ["guard","Yes. The paperwork is in the box on the door.","Ооба. Документтер эшиктеги кутуда.","Иә. Құжаттар есіктегі қорапта.","Да. Документы в ящике на двери."],
    ["me","Okay. Check out at the same gate?","Макул. Ушул эле дарбазадан чыгамбы?","Жарайды. Осы қақпадан шығамын ба?","Хорошо. Выезд через эти же ворота?"],
    ["guard","Yes. Have a safe trip.","Ооба. Жолуң болсун.","Иә. Жолың болсын.","Да. Счастливого пути."]
  ]},
  { photo:"img/d2/31.jpg", en:"Wrong building", title:["Туура эмес имарат","Дұрыс емес ғимарат","Не то здание"], lines:[
    ["guard","This is building A. Your load is at building C.","Бул A имараты. Сенин жүгүң C имаратында.","Бұл A ғимараты. Сенің жүгің C ғимаратында.","Это здание A. Твой груз в здании C."],
    ["me","Sorry. How do I get to building C?","Кечиресиз. C имаратына кантип барам?","Кешіріңіз. C ғимаратына қалай барамын?","Извините. Как проехать к зданию C?"],
    ["guard","Turn around here, go right, then left at the light.","Ушул жерден кайрылып, оңго, светофордон солго бурул.","Осы жерден бұрылып, оңға, бағдаршамнан солға бұрыл.","Развернись здесь, направо, на светофоре налево."],
    ["me","Can I turn around here with a 53-foot trailer?","53 футтук трейлер менен ушул жерден кайрыла аламбы?","53 футтық трейлермен осы жерден бұрыла аламын ба?","Здесь развернусь с 53-футовым трейлером?"],
    ["guard","Yes, use the big lot on the left.","Ооба, сол жактагы чоң аянтты колдон.","Иә, сол жақтағы үлкен алаңды пайдалан.","Да, через большую площадку слева."],
    ["me","Thank you for your help.","Жардамыңыз үчүн рахмат.","Көмегіңізге рахмет.","Спасибо за помощь."]
  ]},
  { photo:"img/d2/32.jpg", en:"Dispatcher: running late", title:["Диспетчер: кечигип жатам","Диспетчер: кешігіп жатырмын","Диспетчер: опаздываю"], lines:[
    ["me","Hi, I'm going to be late for my delivery.","Салам, жүк тапшырууга кечигем.","Сәлем, жүк тапсыруға кешігемін.","Привет, я опоздаю на выгрузку."],
    ["disp","What happened?","Эмне болду?","Не болды?","Что случилось?"],
    ["me","There's a bad accident. The highway is closed.","Катуу авария болду. Трасса жабык.","Ауыр апат болды. Трасса жабық.","Серьёзная авария. Трасса закрыта."],
    ["disp","What's your new ETA?","Эми качан жетесиң?","Енді қашан жетесің?","Когда теперь будешь?"],
    ["me","About two hours late. Around 3 p.m.","Эки саатка кечигем. Түшкү 3тө.","Екі сағатқа кешігемін. Түскі 3-те.","Опоздаю на два часа. Около 15:00."],
    ["disp","Okay. I'll call the receiver. Send me a picture of the traffic.","Макул. Алуучуга чалам. Тыгындын сүрөтүн жибер.","Жарайды. Алушыға хабарласамын. Кептелістің суретін жібер.","Хорошо. Позвоню получателю. Пришли фото пробки."],
    ["me","Okay, sending it now.","Макул, азыр жиберем.","Жарайды, қазір жіберемін.","Хорошо, отправляю."]
  ]},
  { photo:"img/d2/33.jpg", en:"Asking for home time", title:["Үйгө кетүү","Үйге кету","Домой на отдых"], lines:[
    ["me","I want to go home next week.","Кийинки жумада үйгө кетким келет.","Келесі аптада үйге кеткім келеді.","Хочу домой на следующей неделе."],
    ["disp","How many days do you need?","Канча күн керек?","Қанша күн керек?","Сколько дней нужно?"],
    ["me","Four days, please. My son has a birthday.","Төрт күн. Уулумдун туулган күнү.","Төрт күн. Ұлымның туған күні.","Четыре дня. У сына день рождения."],
    ["disp","Where is home?","Үйүң кайда?","Үйің қайда?","Где ты живёшь?"],
    ["me","Chicago, Illinois.","Чикаго, Иллинойс.","Чикаго, Иллинойс.","Чикаго, Иллинойс."],
    ["disp","I'll find a load toward Chicago for Friday.","Жумага Чикаго жакка жүк таап берем.","Жұмаға Чикаго жаққа жүк тауып беремін.","Найду груз в сторону Чикаго на пятницу."],
    ["me","Thank you so much.","Абдан чоң рахмат.","Үлкен рахмет.","Огромное спасибо."]
  ]},
  { photo:"img/d2/34.jpg", en:"34-hour reset", title:["34 сааттык эс алуу","34 сағаттық демалыс","34-часовой рестарт"], lines:[
    ["disp","You're almost out of hours on your 70.","70 саатыңдан дээрлик калган жок.","70 сағатыңнан дерлік қалмады.","Часы по 70 почти закончились."],
    ["me","Yes, I need a 34-hour reset.","Ооба, 34 сааттык эс алуу керек.","Иә, 34 сағаттық демалыс керек.","Да, нужен 34-часовой рестарт."],
    ["disp","Where can you park safely?","Кайда коопсуз токтой аласың?","Қайда қауіпсіз тұра аласың?","Где можешь безопасно встать?"],
    ["me","At the Pilot in Joplin. They have parking.","Джоплиндеги Pilot'то. Ал жерде орун бар.","Джоплиндегі Pilot-та. Онда орын бар.","На Pilot в Джоплине. Там есть места."],
    ["disp","Okay. Your next load will be ready Monday.","Макул. Кийинки жүгүң дүйшөмбүдө даяр болот.","Жарайды. Келесі жүгің дүйсенбіде дайын.","Хорошо. Следующий груз будет в понедельник."],
    ["me","Great. I'll go off duty now.","Жакшы. Азыр off duty коём.","Жақсы. Қазір off duty қоямын.","Отлично. Ставлю off duty."]
  ]},
  { photo:"img/d2/det.jpg", en:"Broker: detention pay", title:["Брокер: күтүү акысы","Брокер: күту ақысы","Брокер: оплата простоя"], lines:[
    ["me","Hi, I've been waiting at the receiver for four hours.","Салам, алуучуда төрт саат күтүп жатам.","Сәлем, алушыда төрт сағат күтіп тұрмын.","Привет, жду у получателя уже четыре часа."],
    ["broker","What time did you check in?","Канчада катталдың?","Қашан тіркелдің?","Во сколько отметился?"],
    ["me","At 7 a.m. My appointment was at 7.","Таңкы 7де. Убактым 7де эле.","Таңғы 7-де. Уақытым 7-де болатын.","В 7 утра. Запись была на 7."],
    ["broker","Detention starts after two hours. It's $50 per hour.","Күтүү акысы эки сааттан кийин башталат. Саатына $50.","Күту ақысы екі сағаттан кейін басталады. Сағатына $50.","Простой после двух часов. $50 в час."],
    ["me","Okay. I'll send you the in and out times.","Макул. Кирген-чыккан убакытты жиберем.","Жарайды. Кірген-шыққан уақытты жіберемін.","Хорошо. Пришлю время въезда и выезда."],
    ["broker","Please get them signed on the BOL.","Аларды BOLго кол койдуруп ал.","Оларды BOL-ға қол қойдырып ал.","Пусть распишутся в BOL."],
    ["me","Okay, I will.","Макул, ошентем.","Жарайды, солай істеймін.","Хорошо, сделаю."]
  ]},
  { photo:"img/d2/can.jpg", en:"Load canceled", title:["Жүк жокко чыкты","Жүк тоқтатылды","Груз отменили"], lines:[
    ["broker","Sorry, the shipper canceled the load.","Кечир, жүк ээси жүктү жокко чыгарды.","Кешір, жүк иесі жүкті тоқтатты.","Извини, отправитель отменил груз."],
    ["me","But I'm already at the shipper.","Бирок мен жүк ээсинин жанында турам.","Бірақ мен жүк иесінің жанындамын.","Но я уже у отправителя."],
    ["me","I drove 200 miles empty to get here.","Бул жакка 200 миля бош келдим.","Мұнда 200 миль бос келдім.","Я проехал 200 миль порожняком."],

const foodHay=f=>[f.name,f.city,f.cityEn,f.state,STATES[f.state],f.food,f.type,f.addr,f.note,f.type?"дукон магазин store":""].map(fnorm).join("|");
let FOOD_DB=[], FOOD_ST=0;
const allFoods=()=>FOODS.concat(FOOD_DB);
function foodLoad(){ FOOD_ST=1; rpc("food_list",{}).then(r=>{ FOOD_DB=(r||[]).map(x=>({id:x.id,name:x.name,type:x.type,city:x.city,cityEn:x.city_en,state:x.state,addr:x.addr,phone:x.phone,food:x.food,hours:x.hours,note:x.note})); FOOD_ST=2; if(S.food) foodRefresh(); }).catch(()=>{ FOOD_ST=3; if(S.food) foodRefresh(); }); }
function foodRefresh(){ const r=document.getElementById("fres"); if(r){ r.innerHTML=foodCards(foodFind(S.fq)); } else render(); }
function foodFind(q){ const qs=String(q||"").trim().split(/[\s,]+/).filter(Boolean).map(fnorm).filter(Boolean); if(!qs.length) return allFoods();
  return allFoods().filter(f=>{ const h=foodHay(f); return qs.every(x=>h.includes(x)); }); }
const fesc=t=>esc(t||"");
function foodCards(list){
  if(!list.length&&FOOD_ST===1) return `<p style="text-align:center;font-size:30px">⏳</p>`;
  if(!list.length) return `<div class="fund"><div class="fb" style="text-align:center"><div style="font-size:46px">🍽️</div><h3>${allFoods().length?"Бул шаардан азырынча жер табылган жок":"Азырынча тизме бош"}</h3><p>Жакшы СНГ кафе же дүкөн билсеңиз, бизге жазыңыз — тизмеге кошобуз.</p>
    <a class="wa" href="https://wa.me/${WA_NUM}?text=${encodeURIComponent("Салам! Тамак-аш тизмесине жер кошуу керек:")}" target="_blank" rel="noopener">💬 WhatsApp · ${WA_NAME}</a></div></div>`;
  const by={}; list.forEach(f=>{ const k=(f.city||"")+", "+(f.state||""); (by[k]=by[k]||[]).push(f); });
  return Object.keys(by).sort().map(k=>`<div class="fcity">📍 ${fesc(k)}${STATES[by[k][0].state]?` · ${STATES[by[k][0].state]}`:""} <span>${by[k].length}</span></div>`+by[k].map(f=>`<div class="food">
    <div class="ft"><b>${fesc(f.name)}</b>${f.type?`<span>${fesc(f.type)}</span>`:""}</div>
    ${f.food?`<p>🍲 ${fesc(f.food)}</p>`:""}${f.addr?`<p>🏠 ${fesc(f.addr)}</p>`:""}${f.hours?`<p>🕒 ${fesc(f.hours)}</p>`:""}${f.note?`<p>ℹ️ ${fesc(f.note)}</p>`:""}
    <div class="fbtn">${f.addr?`<a href="https://maps.google.com/?q=${encodeURIComponent(f.name+" "+f.addr)}" target="_blank" rel="noopener">🗺️ Карта</a>`:""}${f.phone?`<a href="tel:${fesc(f.phone.replace(/[^0-9+]/g,""))}">📞 Чалуу</a>`:""}${S.fadm&&f.id?`<a class="fdel" data-fdel="${f.id}">🗑</a>`:""}</div></div>`).join("")).join(""); }
const foodBar=()=>`<button class="foodbar" data-fo="open"><b>🍲 СНГ тамак-аштар</b><span>Шаарыңызды жазыңыз — жакын кафе, дүкөндөр чыгат →</span></button>`;

function foodForm(){ const opt=Object.keys(STATES).map(k=>`<option value="${k}">${k} — ${STATES[k]}</option>`).join("");

  if(b.dataset.fo==="add"){ const g=id=>((document.getElementById(id)||{}).value||"").trim(); const er=document.getElementById("ff_err");

     .catch(()=>{ b.disabled=false; er.textContent="Кошулган жок. PIN же интернетти текшериңиз."; }); } },true);

const MPOOL=(()=>{
  const words=s=>s.trim().split(/\s+/);
  const ok=s=>{const n=words(s).length; return n>=3&&n<=8&&s.length<=48;};
  const SENT=[]; DIALOGS.forEach(d=>d.lines.forEach(l=>{ if(ok(l[1])) SENT.push({en:l[1],tr:[l[2],l[3],l[4]]}); }));
  POOLS.W.forEach(c=>{ if(ok(c[0])) SENT.push({en:c[0],tr:[c[2],c[3],c[4]],pr:c[1]}); });
  const QA=[]; const ME=[];
  DIALOGS.forEach(d=>{ for(let i=0;i<d.lines.length;i++){ const l=d.lines[i]; if(l[0]==="me") ME.push(l);
    if(l[0]!=="me"&&d.lines[i+1]&&d.lines[i+1][0]==="me") QA.push({o:l,a:d.lines[i+1],t:d.title}); } });

  const PR=[...POOLS.W.filter(c=>c[0].length<=22),...POOLS.D,...POOLS.P];

})();

function mStart(k){

  if(k==="insp"){ M.qs=shuf(MPOOL.QA).slice(0,8).map(q=>{ const others=shuf(MPOOL.ME.filter(x=>x[1]!==q.a[1])).slice(0,3); const opts=shuf([q.a,...others]); return {...q,opts,ans:opts.indexOf(q.a)}; }); M.pick=null; }

      const bar=document.getElementById("mbar"); if(bar) bar.style.width=(left/60*100)+"%"; if(left<=0){ clearInterval(window.__mt); mEnd(M); render(); } },200); }

}
function mSentPrep(M){ const it=M.items[M.pos]; M.target=it.en.split(/\s+/); M.chips=shuf(M.target.map((w,i)=>({w,i,used:false}))); M.built=[]; M.solved=false; M.showTr=true; }
function mPairsPrep(M){ const seen=new Set(); const L5=[]; for(const c of shuf(MPOOL.PR)){ const t=trTxt(c); if(!t||seen.has(t)||seen.has(c[0])) continue; seen.add(t); seen.add(c[0]); L5.push(c); if(L5.length>=5) break; }
  M.left=shuf(L5); M.right=shuf(L5); M.gone=[]; M.sl=null; M.sr=null; M.bad=null; }
function mSpeedNext(M){ const c=MPOOL.PR[Math.random()*MPOOL.PR.length|0]; const truth=Math.random()<.5; let shown=trTxt(c);
  if(!truth){ let o; do{ o=MPOOL.PR[Math.random()*MPOOL.PR.length|0]; }while(trTxt(o)===shown); shown=trTxt(o); } M.cur={c,shown,truth}; M.flash=null; }
function mSpellPrep(M){ const c=M.items[M.pos]; M.word=c[0].toLowerCase(); const extra="etaoinsrl".split("").filter(x=>!M.word.includes(x)); 
  M.tiles=shuf([...M.word.split(""),...shuf(extra).slice(0,2)].map(ch=>({ch,used:false}))); M.typed=""; M.solved=false; }
function mEnd(M,lose){ if(M.end) return; M.end=lose?"lose":"win"; clearInterval(window.__mt);
  const total = M.k==="sent"?M.items.length : M.k==="insp"?M.qs.length : M.k==="spell"?M.items.length : M.k==="pairs"?15 : M.ok;
  M.total=total; M.stars = M.k==="speed" ? (M.ok>=25?3:M.ok>=15?2:M.ok>=5?1:0) : lose?0:(M.wrong===0?3:M.wrong<=2?2:1);
  if(M.k==="speed"){ M.newBest=gmax("speedBest",M.ok); }
  if(M.k==="insp"&&!lose&&M.wrong===0) ginc("inspPerfect");
  M.xp = lose?2:5+M.ok; GP.xp+=M.xp; gsave(); pushXp(M.xp); M.newBadges=badgeCheck();
