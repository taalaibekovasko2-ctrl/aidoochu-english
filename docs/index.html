<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f5; --card:#fff; --ink:#111; --muted:#6f6f6f; --line:#e2e2de;
  --green:#ff9000; --green-d:#e07b00; --soft:#fff1dc; --bad:#d63a2b; --bad-soft:#fde6e3;
  --or:#ff9000;
  --shadow:0 1px 2px rgba(20,34,26,.04),0 12px 32px rgba(20,34,26,.08);
}
@media all{ :root{--shadow:0 1px 2px rgba(0,0,0,.5)} }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px 20px;color:#fff;margin-bottom:22px;
  background:linear-gradient(135deg,#2f6b45 0%,#1d4a2f 100%)}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero:before{content:"";position:absolute;right:30px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero .top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.logo{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.15);display:grid;place-items:center}
.langs{display:flex;gap:5px}
.langs button{font-size:14.5px;font-weight:800;padding:6px 8px;border-radius:9px;opacity:.72;transition:.2s;letter-spacing:.03em}
.langs button.on{opacity:1;box-shadow:0 0 0 2px #fff}
.langs .kg{background:#E8112D;color:#FFD200}
.langs .kz{background:#00AFCA;color:#FEC50C;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.langs .us{background:linear-gradient(#3C3B6E,#3C3B6E) 0 0/42% 54% no-repeat,repeating-linear-gradient(#B22234 0 3px,#fff 3px 6px);color:#fff;text-shadow:0 0 3px rgba(0,0,0,.85)}
.langs .ru{background:linear-gradient(#fff 0 33.3%,#0039A6 33.3% 66.6%,#D52B1E 66.6%);color:#fff;text-shadow:0 0 3px rgba(0,0,0,.75)}
.hero h1{font-size:26px;line-height:1.15;font-weight:800;margin:18px 0 4px;letter-spacing:-.02em;position:relative}
.hero p{margin:0;opacity:.8;font-size:16px;position:relative}
.stats{display:flex;gap:8px;margin-top:16px;position:relative}
.stats span{background:rgba(255,255,255,.13);border-radius:10px;padding:7px 10px;font-size:14.5px;font-weight:600}

.h2{font-size:19px;font-weight:700;margin:0 4px 12px}

/* tiles */
.lock{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:22px 18px;margin-top:14px}
.lock h3{font-size:20px;margin:0 0 6px}.lock p{color:var(--muted);font-size:15px;margin:14px 0 8px;line-height:1.4}
.did{font:800 30px/1.2 ui-monospace,Menlo,monospace;letter-spacing:3px;text-align:center;background:#eef5ef;border-radius:16px;padding:14px;color:#1f4d31}
.lrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lrow button,.lock .main{border:2px solid #1d2a22;background:#fff;border-radius:14px;padding:12px;font-size:15px;font-weight:800;color:#1d2a22;font-family:inherit}
.lock textarea{width:100%;min-height:90px;border:2px solid #d9dfda;border-radius:14px;padding:12px;font:14px ui-monospace,Menlo,monospace;box-sizing:border-box}
.lock .main{width:100%;margin-top:10px;background:var(--green);border-color:var(--green);color:#fff;font-size:17px}
.lock .err{color:#c0392b;font-weight:700;min-height:18px}
.tile,.stile{position:relative}.lockb{position:absolute;top:8px;right:8px;z-index:2;background:rgba(20,34,26,.78);color:#fff;border-radius:999px;font-size:15px;padding:3px 7px;line-height:1}
.demo{display:flex;align-items:center;gap:10px;background:#fff7dc;border:2px solid #f0d27a;border-radius:18px;padding:12px 14px;margin:12px 0 2px;color:#5b4610;font-weight:700;font-size:16.5px;line-height:1.35}
.demo button{margin-left:auto;flex:none;border:0;border-radius:12px;background:#2f6b45;color:#fff;font-weight:800;font-size:16px;padding:10px 12px;font-family:inherit}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:800;background:#25D366;color:#fff;text-decoration:none;font-family:inherit}
.lback{border:0;background:none;color:#2f6b45;font-weight:800;font-size:15px;padding:6px 0;margin-top:8px;font-family:inherit}
.gtop{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin:14px 0}
.gtop b{font-size:20px;display:block}.gtop small{color:var(--muted);font-size:16px}
.gstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.gstats span{background:#eef5ef;border-radius:999px;padding:7px 11px;font-weight:800;font-size:15.5px;color:#1f4d31}
.gpath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 30px}
.gnode-w{display:flex;flex-direction:column;align-items:center}
.gnode{width:84px;height:84px;border-radius:50%;border:0;background:#cfd8d2;box-shadow:0 7px 0 #a9b5ad;display:grid;place-items:center;position:relative;font-family:inherit;cursor:pointer}
.gnode .gi{font-size:34px;line-height:1}.gnode .gn{position:absolute;bottom:-6px;right:-6px;background:#fff;border-radius:999px;font-weight:900;font-size:15px;padding:3px 8px;box-shadow:0 2px 6px rgba(0,0,0,.15);color:#1f4d31}
.gnode.done{background:#3f8a5c;box-shadow:0 7px 0 #24563a}.gnode.cur{background:#FFD45C;box-shadow:0 7px 0 #c99a1e;animation:gpulse 1.4s ease-in-out infinite}
.gnode.lk{opacity:.75}.gnode:active{transform:translateY(5px);box-shadow:0 2px 0 #a9b5ad}
@keyframes gpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.gst{margin-top:10px;color:#e0a800;font-size:17px;letter-spacing:2px;min-height:18px}.gst small{color:var(--muted);font-size:14.5px;letter-spacing:0;font-weight:700}
.gbar{display:flex;align-items:center;gap:12px;margin:14px 0}.gx{border:0;background:none;font-size:24px;color:#6b786f;font-family:inherit}
.gprog{flex:1;height:16px;background:#e2e8e3;border-radius:99px;overflow:hidden}.gprog i{display:block;height:100%;background:linear-gradient(90deg,#58c27d,#2f6b45);border-radius:99px;transition:width .3s}
.gh{font-size:16px;letter-spacing:1px}
.gtimer{height:8px;background:#e2e8e3;border-radius:99px;overflow:hidden;margin:-6px 0 12px}.gtimer i{display:block;height:100%;background:#3f8fd8;border-radius:99px}.gtimer.warn i{background:#d0342c}
.gnode.boss{width:100px;height:100px;background:#e9d7a8;box-shadow:0 7px 0 #b89a4f}.gnode.boss.done{background:#f2b705;box-shadow:0 7px 0 #b88a00}
.gq{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px;text-align:center;margin-bottom:14px}
.gqt{font-weight:800;color:var(--muted);font-size:15px;margin-bottom:12px}
.gimg{width:100%;max-height:260px;object-fit:contain;border-radius:16px;background:#fff}
.gdead{filter:grayscale(1);opacity:.3}
.gpron{font-size:18px;color:#2f6b45;font-weight:700;margin-top:-2px}.gpr{display:block;font-size:16px;color:#5d7466;font-weight:600;margin-top:3px}
.gemo{font-size:80px;line-height:1.1}.gword{font-size:28px;font-weight:900;margin:6px 0;color:#14221a}
.glisten{width:120px;height:120px;border-radius:50%;border:0;background:#2f6b45;color:#fff;font-size:52px;box-shadow:0 8px 0 #1f4d31}
.gopts{display:grid;gap:10px}.gopt{border:2px solid #d4ddd6;border-bottom-width:5px;background:#fff;border-radius:16px;padding:15px;font-size:17px;font-weight:800;text-align:left;font-family:inherit;color:#14221a}
.gopt.ok{background:#dff5e5;border-color:#3f9a5f;color:#1f6b3a}.gopt.no{background:#fde4e1;border-color:#d0342c;color:#a1271f}.gopt.dim{opacity:.5}
.gfb{position:sticky;bottom:86px;margin-top:14px;border-radius:20px;padding:16px;font-size:17px}
.gfb.ok{background:#d7f2de;color:#1f6b3a}.gfb.no{background:#fbdcd8;color:#a1271f}
.gfbw{font-size:16.5px;margin:6px 0 10px;color:#3b4a40}.gfbw span{color:#2f6b45}
.gfb button{width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:900;color:#fff;background:#2f6b45;font-family:inherit}.gfb.no button{background:#c0392b}
.gend{text-align:center;padding:30px 10px}.gbig{font-size:96px}.gend h2{font-size:28px;margin:10px 0}
.gstars{font-size:52px;color:#f2b705;letter-spacing:6px}.gstars span{color:#cfd8d2}.gend p{font-weight:800;color:#2f6b45;font-size:18px}
.gmodes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.gmodes button{border:0;border-radius:18px;padding:14px 8px;font-size:16px;font-weight:900;font-family:inherit;color:#fff;background:linear-gradient(135deg,#2f6b45,#1f4d31);box-shadow:var(--shadow)}
.gmodes button+button{background:linear-gradient(135deg,#c0392b,#8e2a20)}
.onl{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin:14px 0}
.onl h2{margin:4px 0 4px;font-size:22px}.onl>small{color:var(--muted);font-size:16px;display:block;margin-bottom:10px}
.lgr{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid #eef1ef;font-size:16px}
.lgr b{width:34px;text-align:center;font-size:18px}.lgr span{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lgr i{font-style:normal;font-weight:900;color:#2f6b45}
.lgr.me{background:#fff6d6;border-radius:12px}
.onl input{width:100%;box-sizing:border-box;border:2px solid #1d2a22;border-radius:14px;padding:14px;font-size:18px;font-family:inherit;margin:8px 0}
.dvs{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f4f7f5;border-radius:16px;padding:12px;margin:8px 0;font-weight:800}
.dvs div{flex:1;text-align:center;overflow:hidden}.dvs div small{display:block;color:var(--muted);font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dvs div b{font-size:24px}
.dlink{word-break:break-all;background:#f4f7f5;border-radius:12px;padding:10px;font-size:16px;margin:8px 0;user-select:all}
.gwa{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border-radius:14px;padding:14px;font-size:16px;font-weight:900;color:#fff;background:#25d366;margin-top:10px}
.gsec{width:100%;margin-top:10px;border:2px solid #1d2a22;background:#fff;border-radius:14px;padding:14px;font-size:16px;font-weight:800;font-family:inherit}
#nav button{font-size:12.5px;letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.seg button{border:2px solid #1d2a22;background:#fff;color:#1d2a22;border-radius:16px;padding:13px 6px;font-size:16px;font-weight:800}
.seg button.on{background:var(--green);border-color:var(--green);color:#fff}
.emo{display:grid;place-items:center;height:100%;font-size:64px;background:linear-gradient(135deg,#eef5ef,#dcebe0);line-height:1}
.card .art .emo{font-size:110px;background:linear-gradient(135deg,#f5f1e7,#e6efe7)}
.wsearch{width:100%;border:2px solid #d9dfda;border-radius:16px;padding:13px 14px;font-size:16px;margin:10px 0;background:#fff;font-family:inherit}
.wgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.wcell{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:10px 6px;text-align:center;border:0;font-family:inherit}
.wcell .we{display:block;font-size:34px;line-height:1.15}
.wcell b{display:block;font-size:15.5px;font-weight:800;color:#14221a;margin-top:4px;word-break:break-word}
.wcell small{display:block;font-size:15px;color:var(--muted);margin-top:2px;word-break:break-word}
.wcell:active{transform:scale(.96)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:24px;padding:10px 10px 14px;box-shadow:var(--shadow);text-align:center;
  transition:transform .15s;animation:up .35s ease both}
.tile:active{transform:scale(.97)}
.art{border-radius:16px;overflow:hidden;aspect-ratio:16/11;margin-bottom:10px}
.art svg,.art img{width:100%;height:100%;display:block;object-fit:cover}
.tile b{display:block;font-size:15px;font-weight:700;line-height:1.25;padding:0 4px}
.tile em{display:block;font-style:normal;color:#c25e00;font-size:15px;font-weight:600;margin-top:3px}
.tile em:empty{display:none}
.tile small{display:block;color:var(--muted);font-size:14.5px;margin-top:4px;font-weight:500}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* bars */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.circle{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.bar .ttl{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .num{color:var(--muted);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.prog{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#4f9e6e,#2f6b45);border-radius:5px;transition:width .35s}

/* flashcard */
.card{background:var(--card);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;user-select:none;touch-action:pan-y}
.card .art{border-radius:0;aspect-ratio:auto;height:180px;margin:0}
.card .art svg,.card .art img{height:180px}
.card .body{padding:26px 22px 30px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center}
.card.in-l{animation:inL .3s ease}
.card.in-r{animation:inR .3s ease}
@keyframes inL{from{opacity:0;transform:translateX(30px) rotate(1deg)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(-30px) rotate(-1deg)}to{opacity:1;transform:none}}
.en{font-size:28px;font-weight:800;line-height:1.22;letter-spacing:-.025em}
.pr{display:inline-block;margin:14px auto 0;font-size:15.5px;color:#c25e00;font-weight:600;background:var(--soft);padding:6px 12px;border-radius:10px}
.ky{margin-top:22px;padding-top:20px;border-top:1.5px dashed var(--line);font-size:20px;font-weight:600;min-height:30px}
.ky.show{animation:up .28s ease}
.ky.hide{font-size:16px;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:30px;margin-top:22px}
.say{width:68px;height:68px;border-radius:50%;color:#fff;display:grid;place-items:center;
  background:linear-gradient(135deg,#3f8a5c,#2f6b45);box-shadow:0 8px 22px rgba(47,107,69,.35);transition:transform .15s}
.say:active{transform:scale(.93)}
.say.on{animation:pulse 1s ease infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(47,107,69,.14)}}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:90%;animation:up .3s ease both;cursor:pointer}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.ava{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;background:#3b5b8c}
.msg.me .ava{background:var(--green)}
.bub{padding:12px 15px;border-radius:20px 20px 20px 6px;background:var(--card);box-shadow:var(--shadow)}
.msg.me .bub{background:var(--soft);border-radius:20px 20px 6px 20px;box-shadow:none}
.bub .who{font-size:14.5px;color:var(--muted);font-weight:700;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.bub .e{font-size:16.5px;font-weight:600;line-height:1.35}
.bub .k{font-size:16px;color:var(--muted);margin-top:4px;line-height:1.35}
.msg.on .e{color:#c25e00}
.tip{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);font-size:15px;margin:-4px 0 14px}

/* quiz */
.qcard{position:relative;background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:22px 20px;margin-bottom:14px;overflow:hidden}
.qimg{display:block;width:calc(100% + 40px);height:150px;object-fit:cover;margin:-22px -20px 16px}
.qcard .tag{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:#c25e00;background:var(--soft);padding:5px 10px;border-radius:8px;margin-bottom:12px}
.qcard .t{font-size:19px;font-weight:700;line-height:1.4}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:18px;padding:15px 14px;margin-bottom:10px;font-size:16.5px;font-weight:600;transition:.18s;animation:up .3s ease both}
.opt .l{width:30px;height:30px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--muted);flex:none}
.opt.ok{border-color:var(--green);background:var(--soft)}
.opt.ok .l{background:var(--green);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.45}
.exp{display:flex;gap:10px;background:var(--card);border-radius:18px;padding:14px;color:var(--muted);font-size:16.5px;line-height:1.5;margin:4px 0 16px;animation:up .28s ease}
.exp svg{flex:none;color:#c25e00;margin-top:2px}
.main{width:100%;padding:17px;border-radius:18px;color:#fff;font-weight:700;font-size:16px;
  background:linear-gradient(135deg,#3f8a5c,#2f6b45);box-shadow:0 8px 22px rgba(47,107,69,.3)}
.done{text-align:center;padding-top:6vh}
.ring{width:170px;height:170px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center}
.ring div{width:138px;height:138px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:40px;font-weight:800}
.done p{color:var(--muted);margin:0 0 28px;font-weight:500}

.list{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.list .net,.list .phr{padding:14px 16px;display:flex;align-items:center;gap:12px}
.list .net+.net,.list .phr+.phr{border-top:1px solid var(--line)}
.net{flex-wrap:wrap}
.net .t{flex:1 1 100%}
.net b{display:block;font-size:16px;font-weight:700}
.net small{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--soft);color:#c25e00;
  font-weight:700;font-size:15.5px;text-decoration:none}
.shopimg{display:block;width:100%;height:190px;object-fit:cover;border-radius:24px;margin-bottom:14px;box-shadow:var(--shadow)}
.find{display:flex;align-items:center;gap:14px;padding:18px;border-radius:24px;margin-bottom:22px;text-decoration:none;color:#fff;
  background:linear-gradient(135deg,#2f6b45,#1d4a2f);box-shadow:0 10px 26px rgba(47,107,69,.3)}
.acts.more{margin:12px 0 0}

    ["Did you slide the trailer tandems all the way back?", "Дид ю слайд зэ трейлэр тэндэмз ол зэ уэй бэк?", "Трейлердин тандемин толук артка жылдырдыңбы?", "Трейлер тандемін толық артқа жылжыттың ба?", "Ты сдвинул тандем трейлера до конца назад?"],
    ["No problem. Slide the tandems all the way back.", "Ноу проблэм. Слайд зэ тэндэмз ол зэ уэй бэк", "Эч нерсе эмес. Тандемди толук артка жылдыр.", "Ештеңе етпейді. Тандемді толық артқа жылжыт.", "Ничего. Сдвинь тандем до конца назад."],
    ["Put the trailer at DD 105, then unhook and disconnect the lines.", "Пут зэ трейлэр эт ди-ди уан-оу-файв, зэн анхук энд дисконэкт зэ лайнз", "Трейлерди DD 105ке коюп, тракты ажыратып, шлангдарды чеч.", "Трейлерді DD 105-ке қойып, тракты ажыратып, шлангтарды ағыт.", "Поставь трейлер к DD 105, отцепись и отсоедини шланги."],
    ["Should I cut the seal?", "Шуд ай кат зэ сил?", "Пломбаны кесейинби?", "Пломбаны кесейін бе?", "Срезать пломбу?"],
    ["No, don't cut the seal. Leave it as it is.", "Ноу, доунт кат зэ сил. Лив ит эз ит из", "Жок, пломбаны кеспе. Ошол бойдон калтыр.", "Жоқ, пломбаны кеспе. Сол күйінде қалдыр.", "Нет, не срезай пломбу. Оставь как есть."],
    ["Okay. Can you sign my paperwork?", "Оукэй. Кэн ю сайн май пейпэрвёрк?", "Макул. Кагазыма кол коюп бересизби?", "Жарайды. Қағазыма қол қойып бересіз бе?", "Хорошо. Подпишете мои документы?"]
  ]},

  { icon:"truck", photo:"img/hotshot.jpg", en:"Pickup / Hotshot", title:["Пикап / Хотшот","Пикап / Хотшот","Пикап / Хотшот"], cards:[
    ["Hotshot load","Хотшот лоуд","Хотшот жүк (тез жеткирүү)","Хотшот жүк (жедел жеткізу)","Хотшот-груз (срочная доставка)"],
    ["Gooseneck trailer","Гузнэк трейлэр","Гузнек трейлер","Гузнек трейлер","Прицеп гузнек"],
    ["Strap down the load.","Стрэп даун зэ лоуд","Жүктү ремень менен бекит.","Жүкті белдікпен бекіт.","Закрепи груз ремнями."],
    ["Use edge protectors.","Юз эдж протэктэрз","Бурч коргогучтарды кой.","Бұрыш қорғағыштарын қой.","Поставь защитные уголки."],
    ["Is the load tarped?","Из зэ лоуд тарпт?","Жүккө тент жабылганбы?","Жүкке тент жабылған ба?","Груз под тентом?"],
    ["What is the load weight?","Уот из зэ лоуд вейт?","Жүктүн салмагы канча?","Жүктің салмағы қанша?","Какой вес груза?"],
    ["Check your straps every 150 miles.","Чэк ёр стрэпс эври уан хандрэд фифти майлз","Ремендерди ар 150 милде текшер.","Белдіктерді әр 150 мильде тексер.","Проверяй ремни каждые 150 миль."],
    ["Are you ready to load?","Ар ю рэди ту лоуд?","Жүктөөгө даярсыңбы?","Тиеуге дайынсың ба?","Готов к погрузке?"],
    ["Hello! I'm here with a hotshot to pick up a load.", "Хэлоу! Айм хир уиз э хотшот ту пик ап э лоуд", "Саламатсызбы! Хотшот менен жүк алганы келдим.", "Сәлеметсіз бе! Хотшотпен жүк алуға келдім.", "Здравствуйте! Я на хотшоте, за грузом."],
    ["Hello! What's your load number?", "Хэлоу! Уотс ёр лоуд намбэр?", "Саламатсызбы! Жүгүңдүн номери канча?", "Сәлеметсіз бе! Жүгіңнің нөмірі қандай?", "Здравствуйте! Какой номер груза?"],
    ["Where are you taking the load?", "Уэр ар ю тейкинг зэ лоуд?", "Жүктү кайсы жакка алып барасың?", "Жүкті қай жаққа апарасың?", "Куда везёшь груз?"],
    ["What kind of trailer do you have?", "Уот кайнд ов трейлэр ду ю хэв?", "Сенде кандай трейлер бар?", "Сенде қандай трейлер бар?", "Какой у тебя трейлер?"],
    ["I have a 40-foot gooseneck flatbed trailer.", "Ай хэв э фоти-фут гуснэк флэтбэд трейлэр", "Менде 40 футтук гузнек флэтбед трейлер бар.", "Менде 40 футтық гузнек флэтбед трейлер бар.", "У меня 40-футовый гузнек-платформа."],
    ["Do you have chains, straps, and securement equipment?", "Ду ю хэв чейнз, стрэпс, энд сикьюрмэнт икуипмэнт?", "Чынжыр, ремень жана жүк бекитүүчү жабдууларың барбы?", "Шынжыр, белдік және жүк бекіту жабдықтарың бар ма?", "Есть цепи, ремни и крепёж?"],
    ["We're loading one piece of construction equipment. It weighs 7,500 pounds.", "Уир лоудинг уан пис ов кэнстракшн икуипмэнт. Ит вэйз сэвэн фаузэнд файв хандрэд паундз", "Бир курулуш техникасын жүктөйбүз. Салмагы 7 500 фунт.", "Бір құрылыс техникасын тиейміз. Салмағы 7 500 фунт.", "Грузим одну единицу стройтехники. Вес 7 500 фунтов."],
    ["Okay. Who will load the equipment?", "Оукэй. Ху уил лоуд зэ икуипмэнт?", "Макул, техниканы ким жүктөйт?", "Жарайды, техниканы кім тиейді?", "Хорошо. Кто будет грузить технику?"],
    ["Please put it in the middle of the trailer so the weight is balanced.", "Плиз пут ит ин зэ мидл ов зэ трейлэр соу зэ вейт из бэлэнст", "Салмагы туура бөлүнгөндөй трейлердин ортосуна коюңуз.", "Салмағы дұрыс бөлінетіндей трейлердің ортасына қойыңыз.", "Поставьте по центру трейлера, чтобы вес распределился."],
    ["Yes, that's good. Now I'll secure it with chains.", "Йес, зэтс гуд. Нау айл сикьюр ит уиз чейнз", "Ооба, жакшы. Эми чынжыр менен бекитем.", "Иә, жақсы. Енді шынжырмен бекітемін.", "Да, хорошо. Теперь закреплю цепями."],
    ["I'm done securing it. Can I get the paperwork?", "Айм дан сикьюринг ит. Кэн ай гет зэ пейпэрвёрк?", "Бекитип бүттүм. Жүктүн документин бересизби?", "Бекітіп болдым. Жүк құжатын бересіз бе?", "Я закрепил. Дадите документы на груз?"],
    ["Everything looks good. Here's your bill of lading. Sign here.", "Эврифинг лукс гуд. Хирз ёр бил ов лейдинг. Сайн хир", "Баары жакшы. Мына жүк документиң. Ушул жерге кол кой.", "Бәрі жақсы. Міне жүк құжатың. Осы жерге қол қой.", "Всё хорошо. Вот твой BOL. Распишись здесь."],
    ["Hello! I brought your construction equipment.", "Хэлоу! Ай брот ёр кэнстракшн икуипмэнт", "Саламатсызбы! Силерге курулуш техникасын алып келдим.", "Сәлеметсіз бе! Сіздерге құрылыс техникасын әкелдім.", "Здравствуйте! Привёз вам стройтехнику."],
    ["Good. Park your trailer in the open area over there.", "Гуд. Парк ёр трейлэр ин зэ оупэн эриа оувэр зэр", "Жакшы. Трейлериңизди тигил бош аянтка токтотуңуз.", "Жақсы. Трейлеріңізді ана бос алаңға қойыңыз.", "Хорошо. Поставьте трейлер вон на ту свободную площадку."],
    ["First set the trailer brakes and chock the wheels.", "Фёрст сэт зэ трейлэр брейкс энд чок зэ уилз", "Адегенде трейлердин тормозун коюп, дөңгөлөккө такоол кой.", "Алдымен трейлер тежегішін қойып, дөңгелекке тірек қой.", "Сначала поставь трейлер на тормоз и подложи упоры."],
    ["Okay, I checked everything. Can I remove the chains now?", "Оукэй, ай чэкт эврифинг. Кэн ай римув зэ чейнз нау?", "Макул, баарын текшердим. Эми чынжырларды чечсем болобу?", "Жарайды, бәрін тексердім. Енді шынжырларды ағытсам бола ма?", "Хорошо, всё проверил. Можно снимать цепи?"],
    ["Is the equipment in good condition? Any damage?", "Из зи икуипмэнт ин гуд кэндишн? Эни дэмидж?", "Техника жакшы абалдабы? Бузулган жери жокпу?", "Техника жақсы күйде ме? Бүлінген жері жоқ па?", "Техника в порядке? Повреждений нет?"],
    ["Thank you. Can I take a picture to prove the delivery?", "Фэнк ю. Кэн ай тейк э пикчэр ту прув зэ дэливэри?", "Рахмат. Жүктү тапшырганымды тастыктоо үчүн сүрөткө тартсам болобу?", "Рахмет. Жүкті тапсырғанымды растау үшін суретке түсірсем бола ма?", "Спасибо. Можно сфотографировать для подтверждения доставки?"],
    ["Hello! I'm here to pick up, but I can't find the loading area.", "Хэлоу! Айм хир ту пик ап, бат ай кэнт файнд зэ лоудинг эриа", "Саламатсызбы! Жүк алганы келдим, бирок жүктөй турган жерди таппай жатам.", "Сәлеметсіз бе! Жүк алуға келдім, бірақ тиеу орнын таппай жүрмін.", "Здравствуйте! Я за грузом, но не могу найти место погрузки."],
    ["You're at the right place, but the load is in another warehouse.", "Юр эт зэ райт плейс, бат зэ лоуд из ин энэзэр уэрхаус", "Туура жерге келипсиң, бирок жүк башка кампада турат.", "Дұрыс жерге келіпсің, бірақ жүк басқа қоймада тұр.", "Ты на месте, но груз на другом складе."],
    ["Go straight down this street and enter through the second gate.", "Гоу стрейт даун зис стрит энд энтэр фру зэ сэкэнд гейт", "Ушул көчө менен түз барып, экинчи дарбазадан кир.", "Осы көшемен тура барып, екінші қақпадан кір.", "Прямо по этой улице, въезжай во вторые ворота."],
    ["Can I get in there with a big trailer?", "Кэн ай гет ин зэр уиз э биг трейлэр?", "Ал жакка чоң трейлер менен кирсе болобу?", "Ол жаққа үлкен трейлермен кіруге бола ма?", "Туда можно заехать с большим трейлером?"],
    ["Yes, but go slowly. The turn is tight.", "Йес, бат гоу слоули. Зэ тёрн из тайт", "Ооба, бирок акырын кир. Бурула турган жер тар.", "Иә, бірақ ақырын кір. Бұрылыс тар.", "Да, но медленно. Поворот узкий."],
    ["Not yet. You need to wait a little longer.", "Нот йет. Ю нийд ту уэйт э литл лонгэр", "Азырынча даяр эмес, дагы бир аз күтүү керек.", "Әлі дайын емес, тағы аз күту керек.", "Пока нет. Нужно ещё немного подождать."],
    ["Okay, I'll wait in the parking area outside.", "Оукэй, айл уэйт ин зэ паркинг эриа аутсайд", "Макул, сырттагы токтотуучу жайда күтүп турам.", "Жарайды, сыртқы тұрақта күтіп тұрамын.", "Хорошо, подожду на стоянке снаружи."]
  ]},

    ["What are the height, length, and width?", "Уот ар зэ хайт, лэнгс, энд уидс?", "Жүктүн бийиктиги, узундугу жана туурасы канча?", "Жүктің биіктігі, ұзындығы және ені қанша?", "Какая высота, длина и ширина?"],
    ["Where should I park the trailer?", "Уэр шуд ай парк зэ трейлэр?", "Трейлерди кайсы жерге токтотушум керек?", "Трейлерді қай жерге тоқтатуым керек?", "Где поставить трейлер?"],
    ["Do you have chains and binders?", "Ду ю хэв чейнз энд байндэрз?", "Чынжырларың жана бекиткичтериң барбы?", "Шынжырларың мен бекіткіштерің бар ма?", "Есть цепи и стяжки?"],
    ["Please place it correctly on the lower deck.", "Плиз плейс ит кэрэктли он зэ лоуэр дэк", "Техниканы ылдыйкы платформага туура жайгаштырыңыз.", "Техниканы төменгі платформаға дұрыс орналастырыңыз.", "Поставьте правильно на нижнюю площадку."],
    ["Move it back a little. We need to balance the weight.", "Мув ит бэк э литл. Уи нийд ту бэлэнс зэ вейт", "Бир аз артка жылдыруу керек, салмакты туура бөлүштүрүшүбүз керек.", "Сәл артқа жылжыту керек, салмақты дұрыс бөлуіміз керек.", "Чуть назад, нужно распределить вес."],
    ["I'm done. I'll check the load height one more time.", "Айм дан. Айл чэк зэ лоуд хайт уан мор тайм", "Бекитип бүттүм. Жүктүн бийиктигин дагы бир жолу текшерем.", "Бекітіп болдым. Жүктің биіктігін тағы бір рет тексеремін.", "Закрепил. Ещё раз проверю высоту груза."],
    ["Yes, here's your bill of lading. Check the information and sign.", "Йес, хирз ёр бил ов лейдинг. Чэк зи информэйшн энд сайн", "Ооба, бул сенин жүк документиң. Маалыматты текшерип, кол кой.", "Иә, міне жүк құжатың. Мәліметті тексеріп, қол қой.", "Да, вот BOL. Проверь данные и подпиши."],
    ["Will you unload it yourself, or do you need an operator?", "Уил ю анлоуд ит ёрсэлф, ор ду ю нийд эн опэрейтэр?", "Өзүңүз түшүрөсүзбү же оператор керекпи?", "Өзіңіз түсіресіз бе, оператор керек пе?", "Сами разгрузите или нужен оператор?"],
    ["I need an operator. I don't drive the equipment.", "Ай нийд эн опэрейтэр. Ай доунт драйв зи икуипмэнт", "Мага оператор керек, мен техниканы айдабайм.", "Маған оператор керек, мен техниканы жүргізбеймін.", "Нужен оператор, я технику не вожу."],
    ["Is there enough room to pull straight out?", "Из зэр инаф рум ту пул стрейт аут?", "Ал жерден трейлерди түз алып чыгууга орун барбы?", "Ол жерден трейлерді түзу шығаруға орын бар ма?", "Там хватит места выехать прямо?"],
    ["Not yet. First let's make sure the area is safe.", "Нот йет. Фёрст лэтс мэйк шур зи эриа из сейф", "Азырынча жок. Адегенде аймак коопсуз экенин текшерели.", "Әзірге жоқ. Алдымен аймақтың қауіпсіз екенін тексерейік.", "Пока нет. Сначала проверим, что зона безопасна."],
    ["May I take a picture of the delivered load?", "Мэй ай тейк э пикчэр ов зэ дэливэрд лоуд?", "Тапшырылган жүктү сүрөткө тартууга уруксат бересизби?", "Тапсырылған жүкті суретке түсіруге рұқсат бересіз бе?", "Можно сфотографировать доставленный груз?"],
