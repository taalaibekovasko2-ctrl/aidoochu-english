function mMiss(M,defer){ M.wrong++; gBeep(false); if(M.tires<=9){ M.tires--; if(M.tires<=0&&!defer){ mEnd(M,true); } } }
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-mg],[data-mx],[data-mi],[data-mp],[data-mo],[data-my],[data-ms]"); if(!b) return; e.stopPropagation();
  const d=b.dataset;
  if(d.mg){ if(mStart(d.mg)){ render(); window.scrollTo(0,0); const M=S.m; if(M.k==="insp") setTimeout(()=>speak(M.qs[0].o[1],"g"),300); } return; }
  const M=S.m; if(!M) return;
  if(d.mx==="exit"){ clearInterval(window.__mt); S.m=null; render(); window.scrollTo(0,0); return; }
  if(d.mx==="again"){ if(mStart(M.k)){ render(); window.scrollTo(0,0); if(S.m.k==="insp") setTimeout(()=>speak(S.m.qs[0].o[1],"g"),300); } return; }
  if(d.mx==="say"&&M.k==="insp"){ speak(M.qs[M.pos].o[1],"g"); return; }
  if(d.mx==="tr"){ M.showTr=true; render(); return; }
  if(d.mx==="next"){
    if(M.k==="sent"){ if(M.pos+1>=M.items.length) mEnd(M); else { M.pos++; mSentPrep(M); } }
    if(M.k==="insp"){ if(M.tires<=0) mEnd(M,true); else if(M.pos+1>=M.qs.length) mEnd(M); else { M.pos++; M.pick=null; M.showTr=false; setTimeout(()=>speak(M.qs[M.pos].o[1],"g"),250); } }
    if(M.k==="spell"){ if(M.pos+1>=M.items.length) mEnd(M); else { M.pos++; mSpellPrep(M); } }
    render(); window.scrollTo(0,0); return; }
  if(M.end) return;
  if(d.mi!==undefined && M.k==="sent" && !M.solved){ const j=+d.mi, ch=M.chips[j]; if(ch.used) return;
    if(ch.w===M.target[M.built.length]){ ch.used=true; M.built.push(ch.w); M.bad=null; if(M.built.length===M.target.length){ M.solved=true; M.ok++; ginc("sent"); gBeep(true); speak(M.items[M.pos].en,"g"); } }
    else { M.bad=j; mMiss(M); } render(); return; }
  if(d.mp!==undefined && M.k==="pairs"){ const side=d.mp[0], j=+d.mp.slice(1); M.bad=null; if(side==="l") M.sl=j; else M.sr=j;
    if(side==="l") try{ speak(M.left[j][0],"g"); }catch(e){}
    if(M.sl!==null&&M.sr!==null){ const a=M.left[M.sl], c=M.right[M.sr];
      if(a===c){ M.gone.push(a); M.ok++; gBeep(true); }
      else { M.bad={l:M.sl,r:M.sr}; mMiss(M); }
      M.sl=null; M.sr=null;
      if(M.gone.length>=5){ ginc("pairs"); M.round++; if(M.round>=M.rounds) mEnd(M); else setTimeout(()=>{ if(S.m===M){ mPairsPrep(M); render(); } },450); } }
    render(); return; }
  if(d.mo!==undefined && M.k==="insp" && M.pick===null){ const q=M.qs[M.pos]; M.pick=+d.mo; if(M.pick===q.ans){ M.ok++; gBeep(true); } else mMiss(M,true); speak(q.a[1],"g"); render(); return; }
  if(d.my!==undefined && M.k==="speed"){ const ans=d.my==="1"; if(ans===M.cur.truth){ M.ok++; gBeep(true); } else { M.wrong++; gBeep(false); }
    const fl=ans===M.cur.truth?"fok":"fno"; mSpeedNext(M); M.flash=fl; render(); return; }
  if(d.ms!==undefined && M.k==="spell" && !M.solved){ const j=+d.ms, t=M.tiles[j]; if(t.used) return;

    else { M.bad=j; mMiss(M); } render(); return; }

function stopSpeech(){ try{ const s=window.speechSynthesis; if(s && (s.speaking||s.pending)) s.cancel(); }catch(e){} }
function render(anim){
  if(!__ok && __lockOpen){ lockView(); return; }
  $("#nav").style.display="";
  document.documentElement.lang = ["ky","kk","ru","en"][L];
  document.title = UI.title[L];
  $("#nav").innerHTML = ["cards","chat","quiz","game"].map((ic,i)=>
    `<button class="${S.tab===i?"on":""}" data-tab="${i}">${icon(ic,22)}${UI.tabs[L][i]}</button>`).join("");
  $("#app").innerHTML = S.rep ? viewRep() : S.food ? viewFood() : S.fund ? viewFunds() : [viewCards,viewTalk,viewSit,viewGame][S.tab]();
  const c=$("#card"); if(c && anim) c.classList.add(anim>0?"in-l":"in-r");
  bindSwipe(); mark(); wsearch();
}

function move(d){
  const n=TOPICS[S.topic].cards.length;
  S.i=(S.i+d+n)%n; S.open=false; render(d);
}

let swiped=false;
function bindSwipe(){
  const el=$("#card"); if(!el) return;
  let x0=null;
  el.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; swiped=false; },{passive:true});
  el.addEventListener("touchend",e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>50){ swiped=true; move(dx<0?1:-1); }
  });
}

document.addEventListener("keydown",e=>{
  if(S.tab!==0||S.topic===null) return;
  if(e.key==="ArrowRight") move(1);
  if(e.key==="ArrowLeft") move(-1);
  if(e.key===" "){ e.preventDefault(); S.open=!S.open; render(); }
});

document.addEventListener("click",e=>{
  if(e.target.closest("#card")){
    if(swiped){ swiped=false; return; }
    S.open=!S.open; return render();
  }
  const el=e.target.closest("[data-mode],[data-word],[data-sitcat],[data-grp],[data-lang],[data-tab],[data-topic],[data-dialog],[data-say],[data-opt],[data-act]");
  if(!el) return;
  const d=el.dataset;
  if(!__ok && ((d.topic!==undefined && !FREE_T.has(+d.topic)) || (d.word!==undefined && !FREE_T.has(+d.wt)) || (d.dialog!==undefined && +d.dialog>1) || (d.sitcat!==undefined && !isFreeSit(d.sitcat)) || d.act==="mix")){ __lockOpen=true; __msg=""; stopSpeech(); lockView(); window.scrollTo(0,0); return; }
  if(d.grp!==undefined){ S.grp=d.grp||null; render(); const t=document.querySelector('.tip'); if(t&&S.grp) t.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(d.mode!==undefined){ S.mode=+d.mode; return render(); }
  if(d.word!==undefined){ S.topic=+d.wt; S.i=+d.word; S.cat=false; S.open=false; stopSpeech(); render(); window.scrollTo(0,0); return; }
  if(d.lang){ L=+d.lang; try{ localStorage.setItem("lang",LANGS[L]); }catch(e){} return render(); }
  if(d.say){ return speak(d.say, d.key); }
  if(d.act==="say"){ return speak(TOPICS[S.topic].cards[S.i][0], "card"); }
  if(d.act==="next"){ return move(1); }
  if(d.act==="prev"){ return move(-1); }
  if(d.tab){ S.tab=+d.tab; S.topic=null; S.dialog=null; S.shop=false; S.cat=false; S.fund=false; S.food=false; S.rep=false; }
  else if(d.topic){ S.topic=+d.topic; S.i=0; S.open=false; S.cat=!!TOPICS[S.topic].groups; S.grp=null; }
  else if(d.dialog){ S.dialog=+d.dialog; }
  else if(d.sitcat){ startRun(d.sitcat); }
  else if(d.opt){ const R=S.run; if(R&&R.pick===null){ R.pick=+d.opt; if(R.pick===6) R.score++; } return render(); }
  else if(d.act==="shop"){ S.shop=true; }
  else if(d.act==="study"){ S.cat=false; S.i=0; S.open=false; }
  else if(d.act==="back" && S.tab===2){ S.run=null; }
  else if(d.act==="back"){ if(S.topic!==null && TOPICS[S.topic].groups && !S.cat){ S.cat=true; } else { S.topic=null; S.dialog=null; S.shop=false; S.cat=false; } }
  else if(d.act==="nextq"){ S.run.pos++; S.run.pick=null; }
  else if(d.act==="mix"){ startRun(null); }
  else if(d.act==="sitback"){ S.run=null; }
  else if(d.act==="restart"){ startRun(S.run.cat); }
  stopSpeech();
  S.speaking=null;
  render(); window.scrollTo(0,0);
});
