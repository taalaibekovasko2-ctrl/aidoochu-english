<!DOCTYPE html>
<html lang="ky"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ОРТ Даяр — ЖРТга даярдануу платформасы (демо)</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4c3fd1">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#1d1b3a;--sub:#6b6f8a;--line:#e7e8f2;--pri:#5b4cf0;--pri2:#8b7bff;--ok:#20b26b;--bad:#ef4b5f;--bg:#f6f6fc}
body{font-family:Nunito,Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none}
.demo{background:#ffe066;color:#5c4400;text-align:center;font-weight:900;font-size:12.5px;padding:6px}
.top{background:linear-gradient(135deg,#4c3fd1,#7a5cff);color:#fff;padding:16px 18px 22px;border-radius:0 0 28px 28px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:900;font-size:22px;display:flex;align-items:center;gap:8px}.logo i{font-style:normal;background:#fff;color:#4c3fd1;border-radius:10px;padding:2px 8px;font-size:16px}
.lng{display:flex;background:rgba(255,255,255,.18);border-radius:99px;padding:3px}.lng button{color:#fff;font-weight:900;font-size:13px;padding:6px 10px;border-radius:99px}.lng .on{background:#fff;color:#4c3fd1}
.back{background:rgba(255,255,255,.2);color:#fff;font-weight:900;padding:8px 12px;border-radius:12px}
h1{font-size:22px;font-weight:900;margin-top:12px}.top p{opacity:.9;font-weight:700;margin-top:4px;font-size:14px}
.wrap{padding:16px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.h2{font-size:18px;font-weight:900;margin:18px 4px 10px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.kp div{background:rgba(255,255,255,.16);border-radius:16px;padding:10px 6px;text-align:center;font-size:12px;font-weight:800}.kp b{display:block;font-size:22px}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left}.sec i{font-style:normal;font-size:30px}.sec b{display:block;font-size:15px;margin-top:6px}.sec small{color:var(--sub);font-weight:700;font-size:12px}
.pb{height:8px;background:#eceaf9;border-radius:99px;overflow:hidden;margin-top:8px}.pb span{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.big{display:block;width:100%;background:linear-gradient(135deg,#4c3fd1,#7a5cff);color:#fff;font-weight:900;font-size:17px;padding:16px;border-radius:18px;text-align:center;box-shadow:0 8px 20px rgba(91,76,240,.3)}
.big.g{background:linear-gradient(135deg,#20b26b,#12a05c);box-shadow:0 8px 20px rgba(32,178,107,.3)}.big.w{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:3px 8px;border-radius:8px;background:#eceaf9;color:var(--pri)}
.q{font-size:18px;font-weight:800;line-height:1.45}
.txt{background:#f8f7ff;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.55;margin-bottom:12px;color:#3a3760}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 14px;margin-top:10px;font-weight:800;font-size:16px}
.opt em{font-style:normal;width:30px;height:30px;border-radius:10px;background:#eceaf9;color:var(--pri);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.opt.sel{border-color:var(--pri)}.opt.ok{border-color:var(--ok);background:#eafaf2}.opt.ok em{background:var(--ok);color:#fff}.opt.no{border-color:var(--bad);background:#fdecef}.opt.no em{background:var(--bad);color:#fff}
.exp{margin-top:12px;background:#fff8e1;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14.5px;line-height:1.5}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.nav button{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:900;font-size:13px}.nav .cur{border-color:var(--pri);color:var(--pri)}.nav .ans{background:#eceaf9}
.timer{background:#fff;color:#4c3fd1;font-weight:900;padding:7px 12px;border-radius:12px;font-variant-numeric:tabular-nums}
.score{text-align:center;padding:24px 16px}.score .n{font-size:64px;font-weight:900;color:var(--pri);line-height:1}.score .of{color:var(--sub);font-weight:800}
.bar{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-top:12px}
.lb{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-weight:800}.lb:first-child{border:0}.lb b{width:26px;color:var(--sub)}.lb span{flex:1}.lb.me{color:var(--pri)}
.price{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pr{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px}.pr.hot{border-color:var(--pri)}.pr h3{font-size:16px}.pr .p{font-size:26px;font-weight:900;margin:6px 0}.pr li{list-style:none;font-size:13px;font-weight:700;color:var(--sub);margin-top:5px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}.tabs button{flex:1;font-size:11px;font-weight:800;color:var(--sub);padding:6px 0}.tabs button i{display:block;font-style:normal;font-size:22px}.tabs .on{color:var(--pri)}
.pad{height:80px}
.note{font-size:12.5px;color:var(--sub);font-weight:700;line-height:1.5;text-align:center;margin-top:10px}
</style></head><body>
<div class="demo">🧪 ДЕМО-ПРОТОТИП · суроолор мисал үчүн гана</div>
<div id="app"></div>
<script>
var T={ky:{home:"Башкы",prac:"Машыгуу",test:"Сынак тест",rank:"Рейтинг",me:"Мен",hi:"Салам, Айбек! 👋",sub:"ОРТга чейин болжол менен",days:"күн",streak:"күн катары",score:"болжолдуу балл",done:"чечилди",sections:"ОРТнун негизги бөлүмдөрү",subj:"Предметтик тесттер",soon:"жакында",daily:"🎯 Күндүн 5 суроосу",dailyS:"10 мүнөт — күн сайын",mock:"📝 Толук сынак тест",mockS:"Чыныгы ОРТдогудай: таймер, баллдар",start:"Баштоо",next:"Кийинки",check:"Текшерүү",finish:"Аяктоо",res:"Жыйынтык",correct:"туура",est:"Болжолдуу ОРТ баллы",thr:"Босого: 110 балл (2026)",weak:"Күчөтүү керек",again:"Кайра",homeB:"Башкы бетке",explain:"Түшүндүрмө",q:"Суроо",prem:"Тарифтер",free:"Акысыз",pro:"Премиум",lang:"KG"},
ru:{home:"Главная",prac:"Практика",test:"Пробный тест",rank:"Рейтинг",me:"Я",hi:"Привет, Айбек! 👋",sub:"До ОРТ примерно",days:"дней",streak:"дней подряд",score:"примерный балл",done:"решено",sections:"Основные разделы ОРТ",subj:"Предметные тесты",soon:"скоро",daily:"🎯 5 вопросов дня",dailyS:"10 минут — каждый день",mock:"📝 Полный пробный тест",mockS:"Как на настоящем ОРТ: таймер, баллы",start:"Начать",next:"Далее",check:"Проверить",finish:"Завершить",res:"Результат",correct:"верно",est:"Примерный балл ОРТ",thr:"Порог: 110 баллов (2026)",weak:"Нужно подтянуть",again:"Ещё раз",homeB:"На главную",explain:"Объяснение",q:"Вопрос",prem:"Тарифы",free:"Бесплатно",pro:"Премиум",lang:"RU"}};
var SEC=[
{id:"math",e:"📐",ky:"Математика",ru:"Математика",p:62,qs:[
 {q:"Эсептегиле: 3/4 + 1/8 = ?",o:["7/8","4/12","1","5/8"],a:0,x:"Бөлүмдөрдү теңейбиз: 3/4 = 6/8. 6/8 + 1/8 = 7/8."},
 {q:"Эгер 2x − 5 = 11 болсо, x эмнеге барабар?",o:["3","8","6","16"],a:1,x:"2x = 11 + 5 = 16, демек x = 16 : 2 = 8."},
 {q:"Тик бурчтуктун узундугу 8 см, туурасы 5 см. Аянты канча?",o:["13 см²","26 см²","40 см²","80 см²"],a:2,x:"Аянт = узундук × туурасы = 8 × 5 = 40 см²."},
 {q:"350дүн 20% канча?",o:["35","70","20","175"],a:1,x:"350 × 0,2 = 70."},
 {q:"4, 7 жана 10 сандарынын арифметикалык орточосу:",o:["7","21","6","10"],a:0,x:"(4 + 7 + 10) : 3 = 21 : 3 = 7."}]},
{id:"anal",e:"🔗",ky:"Аналогиялар жана сүйлөм толуктоо",ru:"Аналогии и дополнение предложений",p:48,qs:[
 {q:"КИТЕП : КИТЕПКАНА — ушундай байланыштагы жупту тап:",o:["Калем : дептер","Сүрөт : галерея","Нан : ун","Терезе : үй"],a:1,x:"Китептер китепканада сакталат — сүрөттөр галереяда сакталат."},
 {q:"ЫСЫК : СУУК — ушундай байланыштагы жупту тап:",o:["Чоң : зор","Тез : ылдам","Бийик : жапыз","Жакшы : мыкты"],a:2,x:"Бул антонимдер (карама-каршы маанидеги сөздөр): бийик — жапыз."},
 {q:"МУГАЛИМ : МЕКТЕП — ушундай байланыштагы жупту тап:",o:["Дарыгер : оорукана","Окуучу : сабак","Китеп : бет","Айдоочу : жол"],a:0,x:"Мугалим мектепте иштейт — дарыгер ооруканада иштейт."},
 {q:"Сүйлөмдү толукта: «Күн ______ болгондуктан, биз сыртка чыкпадык.»",o:["ачык","жаанчыл","жылуу","тынч"],a:1,x:"Сыртка чыкпаганыбыздын себеби — аба ырайы жаман, б.а. жаанчыл."},
 {q:"Сүйлөмдү толукта: «Ал көп ______, ошондуктан сынактан жакшы өттү.»",o:["уктады","даярданды","ойноду","кечикти"],a:1,x:"Сынактан жакшы өтүүнүн логикалык себеби — даярдануу."}]},
{id:"read",e:"📖",ky:"Окуу жана түшүнүү",ru:"Чтение и понимание",p:55,txt:"Ысык-Көл — Кыргызстандагы эң чоң көл. Ал тоолордун арасында жайгашкан жана кышында да тоңбойт. Ошондуктан аны «ысык» деп аташат. Көлдүн жээгине жай мезгилинде миңдеген эс алуучулар келет.",qs:[

 {q:"Текстин негизги темасы эмне?",o:["Кыргызстандын тоолору","Ысык-Көл жөнүндө маалымат","Жайкы эс алуу эрежелери","Кыштын суугу"],a:1,x:"Бардык сүйлөмдөр Ысык-Көл жөнүндө."},
 {q:"Текст боюнча, эс алуучулар качан көп келет?",o:["Кышында","Жазында","Жай мезгилинде","Күзүндө"],a:2,x:"«Көлдүн жээгине жай мезгилинде миңдеген эс алуучулар келет»."}]},
{id:"gram",e:"✍️",ky:"Практикалык грамматика",ru:"Практическая грамматика",p:40,qs:[
 {q:"Кайсы сөз туура жазылган?",o:["китеп кана","кытепкана","китепкана","китепхана"],a:2,x:"«Китепкана» — бир сөз болуп, биргелешип жазылат."},
 {q:"«Тоо» сөзүнө көптүк мүчөсүн туура тап:",o:["тоолор","тоолар","тоолер","тоодор"],a:0,x:"Үндүүлөрдүн шайкештиги боюнча: о → -лор. Тоо + лор = тоолор."},
 {q:"Кайсы сүйлөмдө ката жок?",o:["Мен эртең мектепке бардым.","Биз кечээ кинодо болдук.","Алар азыр уктады эртең.","Сен кечээ келесиң."],a:1,x:"«Кечээ» өткөн чакты талап кылат — «болдук» туура."}]}];
var SUBJ=[["🧬","Биология","Биология"],["⚗️","Химия","Химия"],["🧲","Физика","Физика"],["🏛","Тарых","История"],["🇬🇧","Англис тили","Английский"],["🗺","География","География"]];
var S={v:"home",lng:"ky"},app=document.getElementById("app");
function t(k){return T[S.lng][k]}
function nm(o){return o[S.lng]}
function hd(title,sub,back,right){return '<div class="top"><div class="row">'+(back?'<button class="back" data-go="'+back+'">‹</button>':'<div class="logo"><i>ОРТ</i>Даяр</div>')+(right||'<div class="lng"><button data-l="ky" class="'+(S.lng=="ky"?"on":"")+'">KG</button><button data-l="ru" class="'+(S.lng=="ru"?"on":"")+'">RU</button></div>')+'</div>'+(title?'<h1>'+title+'</h1>':'')+(sub?'<p>'+sub+'</p>':'')+'</div>'}
function tabs(){var a=[["home","🏠",t("home")],["prac","📚",t("prac")],["mock","📝",t("test")],["rank","🏆",t("rank")],["price","⭐",t("prem")]];
 return '<div class="pad"></div><div class="tabs">'+a.map(function(x){return '<button data-go="'+x[0]+'" class="'+(S.v==x[0]?"on":"")+'"><i>'+x[1]+'</i>'+x[2]+'</button>'}).join("")+'</div>'}
function bar(p){return '<div class="pb"><span style="width:'+p+'%"></span></div>'}
function home(){
 app.innerHTML=hd(t("hi"),t("sub")+" <b>~180</b> "+t("days"))+'<div class="wrap" style="margin-top:-6px">'+
 '<div class="card" style="background:linear-gradient(135deg,#ffffff,#f3f1ff)"><div class="kp" style="margin:0"><div style="background:#f3f1ff;color:#4c3fd1"><b>🔥 7</b>'+t("streak")+'</div><div style="background:#eafaf2;color:#12a05c"><b>154</b>'+t("score")+'</div><div style="background:#fff4e0;color:#d9480f"><b>126</b>'+t("done")+'</div></div></div>'+
 '<button class="big" data-go="daily">'+t("daily")+'<div style="font-size:13px;opacity:.9;font-weight:700">'+t("dailyS")+'</div></button><div style="height:10px"></div>'+
 '<button class="big g" data-go="mock">'+t("mock")+'<div style="font-size:13px;opacity:.9;font-weight:700">'+t("mockS")+'</div></button>'+
 '<div class="h2">'+t("sections")+'</div><div class="secs">'+SEC.map(function(s,i){return '<button class="sec" data-sec="'+i+'"><i>'+s.e+'</i><b>'+nm(s)+'</b><small>'+s.p+'%</small>'+bar(s.p)+'</button>'}).join("")+'</div>'+
 '<div class="h2">'+t("subj")+'</div><div class="secs">'+SUBJ.map(function(s){return '<div class="sec" style="opacity:.6"><i>'+s[0]+'</i><b>'+(S.lng=="ky"?s[1]:s[2])+'</b><small>'+t("soon")+'</small></div>'}).join("")+'</div>'+
 '<p class="note">'+(S.lng=="ky"?"Бул — көрсөтүү үчүн прототип. Суроолор мисал катары жазылган, расмий ОРТ суроолору эмес.":"Это прототип для показа. Вопросы — примеры, а не официальные задания ОРТ.")+'</p></div>'+tabs()}
function prac(){app.innerHTML=hd(t("prac"),"")+'<div class="wrap"><div class="secs">'+SEC.map(function(s,i){return '<button class="sec" data-sec="'+i+'"><i>'+s.e+'</i><b>'+nm(s)+'</b><small>'+s.qs.length+' '+t("q").toLowerCase()+' · '+s.p+'%</small>'+bar(s.p)+'</button>'}).join("")+'</div></div>'+tabs()}
function startQuiz(list,mode,title){S.qz={list:list,i:0,ans:{},mode:mode,title:title,checked:{},t0:Date.now(),lim:mode=="mock"?20*60:0};S.v="quiz";render();if(mode=="mock")tick()}
function tick(){clearInterval(S.tm);S.tm=setInterval(function(){var e=document.getElementById("tm");if(!e||S.v!="quiz"){clearInterval(S.tm);return}var left=Math.max(0,S.qz.lim-Math.floor((Date.now()-S.qz.t0)/1000));e.textContent="⏱ "+Math.floor(left/60)+":"+("0"+left%60).slice(-2);if(!left){clearInterval(S.tm);S.v="res";render()}},500)}
function quiz(){var z=S.qz,it=z.list[z.i],q=it.q,mock=z.mode=="mock",chk=!mock&&z.checked[z.i],sel=z.ans[z.i];
 app.innerHTML=hd(z.title,(z.i+1)+" / "+z.list.length,"home",mock?'<div class="timer" id="tm">⏱ 20:00</div>':null)+'<div class="wrap">'+
 (mock?'<div class="nav">'+z.list.map(function(_,k){return '<button data-qn="'+k+'" class="'+(k==z.i?"cur ":"")+(z.ans[k]!=null?"ans":"")+'">'+(k+1)+'</button>'}).join("")+'</div>':'<div class="pb" style="margin-bottom:14px"><span style="width:'+((z.i)/z.list.length*100)+'%"></span></div>')+
 '<div class="card"><span class="tag">'+it.s.e+' '+nm(it.s)+'</span>'+(it.s.txt?'<div class="txt" style="margin-top:10px">'+it.s.txt+'</div>':'<div style="height:10px"></div>')+'<div class="q">'+q.q+'</div>'+
 q.o.map(function(o,k){var c="opt";if(chk){if(k==q.a)c+=" ok";else if(k==sel)c+=" no"}else if(k==sel)c+=" sel";return '<button class="'+c+'" data-op="'+k+'"><em>'+"АБВГ"[k]+'</em>'+o+'</button>'}).join("")+
 (chk?'<div class="exp">💡 <b>'+t("explain")+':</b> '+q.x+'</div>':'')+'</div>'+
 (mock?'<div class="row" style="gap:10px"><button class="big w" data-qn="'+Math.max(0,z.i-1)+'">‹</button>'+(z.i<z.list.length-1?'<button class="big" data-qn="'+(z.i+1)+'">'+t("next")+' ›</button>':'<button class="big g" data-go="res">'+t("finish")+'</button>')+'</div>':
  (!chk?'<button class="big" data-chk="1"'+(sel==null?' style="opacity:.5"':'')+'>'+t("check")+'</button>':(z.i<z.list.length-1?'<button class="big" data-qn="'+(z.i+1)+'">'+t("next")+' ›</button>':'<button class="big g" data-go="res">'+t("finish")+'</button>')))+'</div>'}
function res(){clearInterval(S.tm);var z=S.qz,ok=0,by={};z.list.forEach(function(it,k){var g=by[it.s.id]=by[it.s.id]||{s:it.s,ok:0,n:0};g.n++;if(z.ans[k]==it.q.a){ok++;g.ok++}});
 var est=Math.round(70+ok/z.list.length*170);
 app.innerHTML=hd(t("res"),z.title,"home")+'<div class="wrap"><div class="card score"><div class="n">'+ok+' / '+z.list.length+'</div><div class="of">'+t("correct")+'</div>'+
 '<div style="margin-top:18px;font-weight:900">'+t("est")+': <span style="color:var(--pri);font-size:22px">~'+est+'</span></div><div class="note">'+t("thr")+' · '+(S.lng=="ky"?"демо эсептөө":"демо-расчёт")+'</div></div>'+
 '<div class="card"><b>📊 '+(S.lng=="ky"?"Бөлүмдөр боюнча":"По разделам")+'</b>'+Object.keys(by).map(function(k){var g=by[k],p=Math.round(g.ok/g.n*100);return '<div class="bar"><span>'+g.s.e+' '+nm(g.s)+'</span><span style="color:'+(p<60?"var(--bad)":"var(--ok)")+'">'+g.ok+'/'+g.n+'</span></div>'+bar(p)}).join("")+'</div>'+
 '<button class="big" data-again="1">🔁 '+t("again")+'</button><div style="height:10px"></div><button class="big w" data-go="home">'+t("homeB")+'</button></div>'}

function allQ(){var a=[];SEC.forEach(function(s){s.qs.forEach(function(q){a.push({s:s,q:q})})});return a}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}

 if(d.l){S.lng=d.l;render();return}
 if(d.go){var g=d.go;if(g=="daily"){startQuiz(shuf(allQ()).slice(0,5),"daily",t("daily"));return}if(g=="mock"&&S.v!="quiz"){startQuiz(allQ(),"mock",t("mock"));return}S.v=g;render();return}

 if(d.op!=null){var z=S.qz;if(z.mode!="mock"&&z.checked[z.i])return;z.ans[z.i]=+d.op;render();return}
 if(d.chk){if(S.qz.ans[S.qz.i]==null)return;S.qz.checked[S.qz.i]=1;render();return}
