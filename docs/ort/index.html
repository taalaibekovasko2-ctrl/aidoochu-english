<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--red:#d62828;--red2:#ef476f;--gold:#f6b40e;--ink:#1a1a2e;--sub:#6c7086;--line:#ececf2;--bg:#faf8f5;--ok:#1aa363;--bad:#e5383b}
body{font-family:Nunito,Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none}
.wrap{padding:16px;max-width:640px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px}
.sun{width:34px;height:34px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:20px}
.free{background:#e8f8ef;color:var(--ok);font-size:11px;font-weight:900;padding:3px 8px;border-radius:8px}
.lng{display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px}.lng button{font-weight:900;font-size:13px;padding:6px 11px;border-radius:99px;color:var(--sub)}.lng .on{background:var(--red);color:#fff}
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,#ffd6d6,#ffe9b3);display:flex;align-items:center;justify-content:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .fb{font-size:54px;opacity:.85}
.hero{border-radius:28px;height:220px;color:#fff}
.hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.65))}
.hero .tx{position:absolute;left:18px;right:18px;bottom:16px}
.hero h1{font-size:24px;font-weight:900;line-height:1.15}.hero p{font-size:14px;font-weight:700;opacity:.95;margin-top:4px}
.goal{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;margin-top:14px}
.ring{width:96px;height:96px;flex:0 0 auto}
.goal b{font-size:15px}.goal p{color:var(--sub);font-weight:700;font-size:13.5px;margin-top:4px;line-height:1.45}
.h2{font-size:18px;font-weight:900;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}.h2 small{font-size:13px;color:var(--red);font-weight:800}
.plan{background:#fff;border:1px solid var(--line);border-radius:22px;padding:6px 14px}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-weight:800;font-size:15px;width:100%;text-align:left}.task:first-child{border:0}
.task .ck{width:26px;height:26px;border-radius:8px;border:2px solid #d5d6e0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex:0 0 auto}.task.done .ck{background:var(--ok);border-color:var(--ok)}.task.done span{color:var(--sub);text-decoration:line-through}
.task em{margin-left:auto;font-style:normal;color:var(--sub);font-size:12px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;text-align:left}
.sc .ph{height:104px}.sc .in{padding:10px 12px 12px}.sc b{font-size:14.5px;display:block;line-height:1.2}.sc small{color:var(--sub);font-weight:700;font-size:12px}
.pb{height:7px;background:#f1eef0;border-radius:99px;overflow:hidden;margin-top:8px}.pb span{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.mock{display:flex;align-items:center;gap:14px;width:100%;background:var(--ink);color:#fff;border-radius:24px;padding:16px;margin-top:14px;text-align:left}
.mock .ph{width:84px;height:84px;border-radius:18px;flex:0 0 auto}.mock b{font-size:17px}.mock p{font-size:13px;opacity:.8;font-weight:700;margin-top:3px}
.btn{display:block;width:100%;background:var(--red);color:#fff;font-weight:900;font-size:17px;padding:16px;border-radius:18px;text-align:center}.btn.l{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.g{background:var(--ok)}
.top2{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:640px;margin:0 auto}
.bk{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:20px;font-weight:900}
.top2 h2{font-size:18px;font-weight:900;flex:1}
.tm{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:900;font-variant-numeric:tabular-nums}
.qb{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px}

.q{font-size:18.5px;font-weight:800;line-height:1.45;margin-top:12px}
.txt{background:#fbf7ee;border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;margin-top:12px;color:#3a3a50}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 14px;margin-top:10px;font-weight:800;font-size:16px}
.opt em{font-style:normal;width:30px;height:30px;border-radius:50%;border:2px solid #d5d6e0;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:14px}
.opt.sel{border-color:var(--red)}.opt.sel em{background:var(--red);border-color:var(--red);color:#fff}
.opt.ok{border-color:var(--ok);background:#ebf9f1}.opt.ok em{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{border-color:var(--bad);background:#fdeeee}.opt.no em{background:var(--bad);border-color:var(--bad);color:#fff}
.exp{margin-top:14px;background:#fff8e6;border-radius:16px;padding:14px;font-weight:700;font-size:14.5px;line-height:1.55}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}.dots button{width:30px;height:30px;border-radius:9px;background:#fff;border:1px solid var(--line);font-weight:900;font-size:12px}.dots .cur{border:2px solid var(--red);color:var(--red)}.dots .an{background:#fdecec}
.foot{display:flex;gap:10px;margin-top:14px}
.res{text-align:center;background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px}
.res .big{font-size:58px;font-weight:900;color:var(--red);line-height:1}
.row{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-top:12px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}.tabs button{flex:1;font-size:11px;font-weight:800;color:var(--sub);padding:5px 0}.tabs i{display:block;font-style:normal;font-size:22px}.tabs .on{color:var(--red)}
.pad{height:84px}
.ob{min-height:100vh;display:flex;flex-direction:column;padding:24px 20px;max-width:560px;margin:0 auto}
.ob .ph{height:260px;border-radius:30px;margin-bottom:22px}
.ob h1{font-size:28px;font-weight:900;line-height:1.15}.ob p{color:var(--sub);font-weight:700;margin-top:8px;line-height:1.5}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.ch button{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 10px;font-weight:900;font-size:16px}.ch .on{border-color:var(--red);background:#fdecec;color:var(--red)}
.steps{display:flex;gap:6px;margin-bottom:18px}.steps i{flex:1;height:5px;border-radius:99px;background:#eee}.steps .on{background:var(--red)}
.note{font-size:12px;color:var(--sub);font-weight:700;text-align:center;margin:14px 0 4px;line-height:1.5}
.lb{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-weight:800}.lb:first-child{border:0}.lb .av{width:38px;height:38px;border-radius:50%;background:#fdecec;display:flex;align-items:center;justify-content:center}.lb span{flex:1}.lb.me{color:var(--red)}
</style></head><body>

 '<div class="goal">'+ring(CUR,P.goal)+'<div><b>'+t("goal")+': '+P.goal+' '+(ky?"балл":"баллов")+'</b><p>'+t("cur")+': <b style="color:var(--red)">'+CUR+'</b><br>'+(ky?"Дагы ":"Ещё ")+Math.max(0,P.goal-CUR)+(ky?" балл — сен жетесиң! 💪":" баллов — ты сможешь! 💪")+'</p></div></div>'+
 '<div class="h2">'+t("plan")+'<small>'+PLAN.filter(function(p){return S.done[p[0]]}).length+'/3</small></div><div class="plan">'+PLAN.map(function(p){var d=S.done[p[0]];return '<button class="task'+(d?" done":"")+'" data-pl="'+p[0]+'"><div class="ck">'+(d?"✓":"")+'</div><span>'+p[1]+' '+nm(p[2])+'</span><em>'+p[3]+'</em></button>'}).join("")+'</div>'+
 '<div class="h2">'+t("sections")+'<small data-go="secs">'+t("all")+' ›</small></div><div class="cards">'+SEC.map(function(s,i){return '<button class="sc" data-sec="'+i+'">'+ph(s.id)+'<div class="in"><b>'+nm(s)+'</b><small>'+s.p+'%</small><div class="pb"><span style="width:'+s.p+'%"></span></div></div></button>'}).join("")+'</div>'+
 '<button class="mock" data-go="mockS">'+ph("mock")+'<div><b>📝 '+t("mock")+'</b><p>'+t("mockS")+'</p></div></button>'+
 '<p class="note">'+(ky?"Демо: суроолор мисал катары жазылган, расмий ОРТ суроолору эмес.":"Демо: вопросы — примеры, не официальные задания ОРТ.")+'</p></div>'+tabs()}
function secs(){app.innerHTML=hdr()+'<div class="wrap"><div class="h2" style="margin-top:4px">'+t("sections")+'</div>'+SEC.map(function(s,i){return '<button class="sc" data-sec="'+i+'" style="display:flex;width:100%;margin-bottom:12px;align-items:stretch">'+ph(s.id,"","width:110px;height:auto;min-height:110px")+'<div class="in" style="flex:1"><b style="font-size:16px">'+nm(s)+'</b><small>'+s.qs.length+' '+(S.lng=="ky"?"суроо":"вопросов")+' · '+s.p+'%</small><div class="pb"><span style="width:'+s.p+'%"></span></div></div></button>'}).join("")+'</div>'+tabs()}
function me(){var ky=S.lng=="ky";var L=[["Айпери",231],["Бекзат",224],["Нурай",219],[P.name||(ky?"Сен":"Ты"),CUR,1],["Эрмек",121]].sort(function(a,b){return b[1]-a[1]});
 app.innerHTML=hdr()+'<div class="wrap"><div class="goal" style="margin-top:4px">'+ring(CUR,P.goal)+'<div><b style="font-size:18px">'+(P.name||"—")+'</b><p>'+t("goal")+': '+P.goal+' · 🔥 7 '+(ky?"күн":"дней")+'</p><button class="btn l" data-reset="1" style="margin-top:8px;padding:8px;font-size:13px">'+(ky?"Максатты өзгөртүү":"Изменить цель")+'</button></div></div>'+
 '<div class="h2">'+t("lead")+'</div><div class="plan">'+L.map(function(x,i){return '<div class="lb'+(x[2]?" me":"")+'"><div class="av">'+(i<3?["🥇","🥈","🥉"][i]:"👤")+'</div><span>'+x[0]+'</span>'+x[1]+'</div>'}).join("")+'</div>'+
 '<div class="h2">🎁 '+(ky?"Платформа бекер":"Платформа бесплатна")+'</div><div class="plan" style="padding:14px;font-weight:700;color:var(--sub);line-height:1.6">'+(ky?"Төлөм, жазылуу жана жарнама жок. Мугалимсизби? Суроо кошуп бериңиз 🤝":"Без оплаты, подписок и рекламы. Вы учитель? Помогите добавить вопросы 🤝")+'</div></div>'+tabs()}
function mockS(){var ky=S.lng=="ky";app.innerHTML=hdr()+'<div class="wrap">'+ph("mock","hero","height:200px;border-radius:28px")+'<div class="h2">📝 '+t("mock")+'</div><div class="plan" style="padding:14px;font-weight:800;line-height:1.9">⏱ 20 '+(ky?"мүнөт":"минут")+'<br>❓ '+allQ().length+' '+(ky?"суроо, 4 бөлүм":"вопросов, 4 раздела")+'<br>📊 '+(ky?"Балл жана бөлүмдөр боюнча анализ":"Балл и анализ по разделам")+'</div><button class="btn" data-mock="1" style="margin-top:14px">'+t("start")+'</button></div>'+tabs()}
function allQ(){var a=[];SEC.forEach(function(s){s.qs.forEach(function(q){a.push({s:s,q:q})})});return a}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function startQ(list,mode,title,key){S.z={list:list,i:0,ans:{},chk:{},mode:mode,title:title,key:key,t0:Date.now(),lim:20*60};S.v="quiz";render();if(mode=="mock")tick()}
function tick(){clearInterval(S.tm);S.tm=setInterval(function(){var e=document.getElementById("tm");if(!e){clearInterval(S.tm);return}var l=Math.max(0,S.z.lim-Math.floor((Date.now()-S.z.t0)/1000));e.textContent="⏱ "+Math.floor(l/60)+":"+("0"+l%60).slice(-2);if(!l){S.v="res";render()}},500)}
function quiz(){var z=S.z,it=z.list[z.i],q=it.q,mk=z.mode=="mock",ch=!mk&&z.chk[z.i],sel=z.ans[z.i];
 app.innerHTML=top2(z.title,"home",mk?'<div class="tm" id="tm">⏱ 20:00</div>':'<div class="tm">'+(z.i+1)+'/'+z.list.length+'</div>')+'<div class="wrap" style="padding-top:4px">'+
 (mk?'<div class="dots">'+z.list.map(function(_,k){return '<button data-qn="'+k+'" class="'+(k==z.i?"cur ":"")+(z.ans[k]!=null?"an":"")+'">'+(k+1)+'</button>'}).join("")+'</div>':'<div class="pb" style="margin:0 0 12px"><span style="width:'+(z.i/z.list.length*100)+'%"></span></div>')+
 '<div class="qb"><span class="tag">'+it.s.e+' '+nm(it.s)+'</span>'+(it.s.txt?'<div class="txt">'+it.s.txt+'</div>':'')+'<div class="q">'+q.q+'</div>'+
 q.o.map(function(o,k){var c="opt";if(ch){if(k==q.a)c+=" ok";else if(k==sel)c+=" no"}else if(k==sel)c+=" sel";return '<button class="'+c+'" data-op="'+k+'"><em>'+"АБВГ"[k]+'</em>'+o+'</button>'}).join("")+
 (ch?'<div class="exp">💡 <b>'+t("exp")+':</b> '+q.x+'</div>':'')+'</div><div class="foot">'+
 (mk?'<button class="btn l" style="width:30%" data-qn="'+Math.max(0,z.i-1)+'">‹</button>'+(z.i<z.list.length-1?'<button class="btn" data-qn="'+(z.i+1)+'">'+t("next")+' ›</button>':'<button class="btn g" data-go="res">'+t("fin")+'</button>'):
 (!ch?'<button class="btn" data-chk="1" style="'+(sel==null?"opacity:.45":"")+'">'+t("check")+'</button>':(z.i<z.list.length-1?'<button class="btn" data-qn="'+(z.i+1)+'">'+t("next")+' ›</button>':'<button class="btn g" data-go="res">'+t("fin")+'</button>')))+'</div></div>'}
function res(){clearInterval(S.tm);var z=S.z,ok=0,by={};z.list.forEach(function(it,k){var g=by[it.s.id]=by[it.s.id]||{s:it.s,ok:0,n:0};g.n++;if(z.ans[k]==it.q.a){ok++;g.ok++}});
 var est=Math.round(70+ok/z.list.length*170);if(z.mode=="mock"){CUR=est;ls("cur",CUR)}if(z.key){S.done[z.key]=1;ls("done",S.done)}var ky=S.lng=="ky";
 var weak=Object.keys(by).filter(function(k){return by[k].ok/by[k].n<0.6});
 app.innerHTML=top2(t("res"),"home")+'<div class="wrap" style="padding-top:4px"><div class="res"><div style="display:flex;justify-content:center">'+ring(z.mode=="mock"?est:CUR,P.goal)+'</div><div class="big" style="margin-top:8px">'+ok+'/'+z.list.length+'</div><div style="color:var(--sub);font-weight:800">'+t("correct")+'</div>'+(z.mode=="mock"?'<div style="margin-top:12px;font-weight:900">'+t("est")+': <span style="color:var(--red)">~'+est+'</span> · '+t("goalT")+': '+P.goal+'</div><p class="note">'+(ky?"Демо-эсептөө, расмий шкала эмес":"Демо-расчёт, не официальная шкала")+'</p>':'')+'</div>'+
 '<div class="h2">📊 '+(ky?"Бөлүмдөр боюнча":"По разделам")+'</div><div class="plan" style="padding:6px 14px 14px">'+Object.keys(by).map(function(k){var g=by[k],p=Math.round(g.ok/g.n*100);return '<div class="row"><span>'+g.s.e+' '+nm(g.s)+'</span><span style="color:'+(p<60?"var(--bad)":"var(--ok)")+'">'+g.ok+'/'+g.n+'</span></div><div class="pb"><span style="width:'+p+'%"></span></div>'}).join("")+'</div>'+
 (weak.length?'<div class="h2">🔁 '+t("weak")+'</div><div class="cards">'+weak.map(function(k){var i=SEC.indexOf(by[k].s);return '<button class="sc" data-sec="'+i+'">'+ph(k)+'<div class="in"><b>'+nm(by[k].s)+'</b></div></button>'}).join("")+'</div>':'')+
 '<div class="foot"><button class="btn l" data-go="home">'+t("homeB")+'</button><button class="btn" data-again="1">'+t("again")+'</button></div></div>'}
function render(){window.scrollTo(0,0);({ob:ob,home:home,secs:secs,me:me,mockS:mockS,quiz:quiz,res:res}[S.v]||home)()}
document.addEventListener("click",function(e){var b=e.target.closest("button,[data-go]");if(!b)return;var d=b.dataset;
 if(d.l){S.lng=P.lng=d.l;ls("p",P);render();return}
 if(d.ol){S.lng=P.lng=d.ol;render();return}
 if(d.og){P.goal=+d.og;render();return}
 if(d.on){if(S.step==2){var v=(document.getElementById("nm").value||"").trim();P.name=v.slice(0,20);ls("p",P);S.v="home";render();return}S.step++;render();return}
 if(d.reset){S.step=1;S.v="ob";render();return}
 if(d.go){if(d.go=="res"){S.v="res";render();return}S.v=d.go;render();return}
 if(d.pl){var k=d.pl;if(k=="daily")startQ(shuf(allQ()).slice(0,5),"daily",PLAN[0][1]+" "+nm(PLAN[0][2]),k);else{var s=SEC[+k.slice(3)];startQ(s.qs.map(function(q){return {s:s,q:q}}),"sec",s.e+" "+nm(s),k)}return}
 if(d.sec!=null){var s2=SEC[+d.sec];startQ(s2.qs.map(function(q){return {s:s2,q:q}}),"sec",s2.e+" "+nm(s2));return}
 if(d.mock){startQ(allQ(),"mock",t("mock"));return}
 if(d.op!=null){var z=S.z;if(z.mode!="mock"&&z.chk[z.i])return;z.ans[z.i]=+d.op;render();return}
 if(d.chk){if(S.z.ans[S.z.i]==null)return;S.z.chk[S.z.i]=1;render();return}
 if(d.qn!=null){S.z.i=+d.qn;render();return}
 if(d.again){startQ(S.z.list,S.z.mode,S.z.title,S.z.key);return}
});
render();
