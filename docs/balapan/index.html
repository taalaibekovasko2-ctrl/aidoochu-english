var BP={
hair:["💇","волосы","hair","Волосы защищают голову от солнца и холода. Они растут каждый день понемногу. Расчёсывай их и держи в чистоте!","Hair protects your head from sun and cold. It grows a little every day. Keep it clean and brush it!",150,40,"o"],
head:["🙂","голова","head","В голове живёт мозг — он управляет всем телом. Катаешься на велосипеде — надевай шлем!","Your brain lives inside your head and controls your whole body. Wear a helmet when you ride a bike!",112,62,"o"],
eye:["👁️","глаза","eyes","Глазами мы видим цвета, картинки и маму! Когда мы моргаем, глаза очищаются. Если долго смотреть в телефон, глаза устают.","We see colors, pictures and mom with our eyes! Blinking keeps them clean. Looking at a phone for too long makes eyes tired.",130,90,"o"],
ear:["👂","уши","ears","Ушами мы слышим музыку и пение птиц. Уши ещё помогают нам держать равновесие. Ничего не засовывай в уши!","We hear music and birds with our ears. Ears also help us keep our balance. Never put anything inside your ears!",97,95,"o"],
nose:["👃","нос","nose","Носом мы дышим и чувствуем запахи: цветов, свежего хлеба. Маленькие волоски в носу задерживают пыль.","We breathe and smell with our nose: flowers, fresh bread. Tiny hairs inside catch dust.",150,102,"o"],
mouth:["👄","рот","mouth","Ртом мы говорим, поём и едим. Жуй еду медленно и хорошо!","We talk, sing and eat with our mouth. Chew your food slowly and well!",150,119,"o"],
neck:["🧣","шея","neck","Шея соединяет голову с телом. Благодаря ей мы поворачиваем голову влево, вправо, вверх и вниз.","Your neck joins your head to your body. It lets you turn your head left, right, up and down.",150,148,"o"],
shoulder:["🤷","плечи","shoulders","Руки начинаются от плеч. Плечи помогают поднимать и крутить руки. Носи рюкзак на двух плечах!","Your arms start at your shoulders. Shoulders help you lift and swing your arms. Wear your backpack on both shoulders!",104,176,"o"],
chest:["🫁","грудь","chest","Внутри груди — сердце и лёгкие. Рёбра защищают их, как коробочка. Сделай глубокий вдох — грудь поднимется!","Your heart and lungs are inside your chest. Ribs protect them like a box. Take a deep breath — your chest rises!",150,205,"o"],
belly:["🤰","живот","belly","В животе работают желудок и кишечник — они переваривают еду. Когда ты голоден, живот урчит!","Your stomach and intestines work inside your belly to digest food. When you're hungry, your belly rumbles!",150,290,"o"],
arm:["💪","руки","arms","Руками мы берём, пишем, рисуем и обнимаем. У человека две руки.","We hold, write, draw and hug with our arms. People have two arms.",80,215,"o"],
elbow:["🦾","локоть","elbow","Локоть — это сустав в середине руки. Он помогает сгибать руку, например, чтобы поднести ложку ко рту.","Your elbow is a joint in the middle of your arm. It lets you bend your arm, like bringing a spoon to your mouth.",76,255,"o"],
hand:["✋","ладонь","palm","Ладонью мы держим вещи и хлопаем. Мой руки с мылом перед едой — микробы уйдут!","We hold things and clap with our palms. Wash your hands with soap before eating to get rid of germs!",70,342,"o"],
finger:["👆","пальцы","fingers","На одной руке 5 пальцев, на двух — 10. Отпечатки пальцев у всех людей разные — таких, как у тебя, больше нет ни у кого!","There are 5 fingers on each hand, 10 in all. Everyone's fingerprints are different — nobody has the same as you!",70,362,"o"],
leg:["🦵","ноги","legs","Ногами мы ходим, бегаем, прыгаем и пинаем мяч. Ноги держат всё наше тело.","We walk, run, jump and kick a ball with our legs. Legs hold up our whole body.",124,370,"o"],
knee:["🦿","колено","knee","Колено — это сустав в середине ноги. Оно помогает сидеть и прыгать. На велосипеде надевай наколенники.","Your knee is a joint in the middle of your leg. It helps you sit and jump. Wear knee pads on a bike.",123,440,"o"],
foot:["🦶","стопа","foot","Стопами мы стоим на земле. В одной стопе 26 косточек! Носи удобную обувь.","We stand on our feet. Each foot has 26 bones! Wear comfortable shoes.",116,515,"o"],
teeth:["🦷","зубы","teeth","У детей 20 молочных зубов. Потом они выпадают, и вырастают 32 постоянных. Чисти зубы 2 раза в день!","Children have 20 baby teeth. Later they fall out and 32 adult teeth grow. Brush your teeth twice a day!",0,0,"o"],
tongue:["👅","язык","tongue","Язык чувствует вкус: сладкое, солёное, кислое и горькое. Без языка мы не смогли бы говорить.","Your tongue tastes sweet, salty, sour and bitter. Without it, we couldn't talk.",0,0,"o"],
skin:["🖐️","кожа","skin","Кожа покрывает всё тело, как одежда, и защищает его. Она чувствует тепло, холод и прикосновения. Береги её от солнца!","Skin covers your whole body like clothes and protects it. It feels hot, cold and touch. Protect it from the sun!",0,0,"o"],
nails:["💅","ногти","nails","Ногти защищают кончики пальцев. Они всё время растут, поэтому их нужно подстригать.","Nails protect the tips of your fingers. They keep growing, so we trim them.",0,0,"o"],
brain:["🧠","мозг","brain","Мозг — главный командир тела. Мы думаем, запоминаем, учимся и мечтаем благодаря мозгу. Ночью во сне мозг отдыхает — ложись спать вовремя!","The brain is the boss of your body. It helps you think, remember, learn and dream. It rests while you sleep, so go to bed on time!",150,70,"i"],
lungs:["🫁","лёгкие","lungs","У нас два лёгких. Когда мы вдыхаем, они наполняются воздухом, как шарики. Играй на свежем воздухе!","We have two lungs. When we breathe in, they fill with air like balloons. Play outside in fresh air!",128,205,"i"],
heart:["❤️","сердце","heart","Сердце размером с твой кулачок. Оно всё время бьётся и гонит кровь по всему телу. Положи руку на грудь — слышишь «тук-тук»?","Your heart is about the size of your fist. It beats all the time and pumps blood around your body. Put your hand on your chest — feel the thump?",158,218,"i"],
liver:["🟤","печень","liver","Печень очищает организм и убирает вредные вещества из еды. Это один из самых больших органов внутри тела.","The liver cleans your body and removes harmful things from food. It's one of the biggest organs inside you.",128,262,"i"],
stomach:["🫃","желудок","stomach","Желудок перемешивает и размягчает еду, как кашу. Поэтому еду нужно хорошо жевать.","Your stomach mixes and mashes food into a mush. That's why you should chew well.",172,265,"i"],
intestines:["🌀","кишечник","intestines","Кишечник очень длинный и сложен в животе. Он забирает из еды всё полезное и отдаёт телу.","Your intestines are very long and folded up in your belly. They take the good stuff from food and give it to your body.",150,306,"i"],
