*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b1630;--c1:#122247;--c2:#182c58;--ln:#24396b;--tx:#fff;--mu:#9fb0d4;--ac:#ff8c1a;--gr:#3ddc84;--rd:#ff6b6b;--bl:#4c8dff}

body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
#app{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 20px}

.seg{display:flex;gap:6px;margin-bottom:10px}
.seg b{flex:1;text-align:center;padding:10px 0;border-radius:12px;background:var(--c1);color:var(--mu);font-weight:700;font-size:14px;cursor:pointer}

.v{font-size:22px;font-weight:800}
