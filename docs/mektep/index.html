<!DOCTYPE html>
<html lang="ky"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mektep — мектеп платформасы</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f8f83">
<style>
:root{--g:#2f8f83;--g2:#3fa99b;--gl:#e3f3f0;--bg:#eef4f3;--tx:#11302c;--mut:#6b8380;--y:#f2c94c;--r:#e5534b;--o:#ff9f43;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button{font-family:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--g);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;margin-bottom:18px;padding:0 8px}
.logo i{font-style:normal;width:38px;height:38px;border-radius:12px;background:#fff;color:var(--g);display:grid;place-items:center;font-size:20px}
.nav{border:0;background:none;color:#fff;text-align:left;padding:11px 12px;border-radius:12px;font-size:14.5px;display:flex;gap:10px;opacity:.85}
.nav.on{background:#fff;color:var(--g);opacity:1;font-weight:800}
.sup{margin-top:auto;background:rgba(255,255,255,.14);border-radius:16px;padding:14px;font-size:13px;line-height:1.4}.sup b{display:block;font-size:14.5px}
.main{padding:20px 26px 90px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.roles{display:flex;gap:6px;background:#fff;padding:5px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.roles button{border:0;background:none;padding:9px 14px;border-radius:10px;font-weight:800;font-size:13.5px;color:var(--mut)}
.roles button.on{background:var(--g);color:#fff}
.me{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--mut)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:14px;flex:none}
h1{font-size:24px;font-weight:900;margin:18px 0 4px}.lead{color:var(--mut);font-size:14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 4px 18px rgba(17,48,44,.05);min-width:0}
.c h3{font-size:15.5px;font-weight:900;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.c h3 small{font-size:12px;color:var(--mut);font-weight:600;background:var(--gl);padding:4px 9px;border-radius:99px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.kpi b{font-size:30px;font-weight:900;display:block}.kpi span{color:var(--mut);font-size:13px}.kpi i{font-style:normal;font-size:22px;float:right}
.studs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.st{flex:none;width:92px;background:var(--gl);border-radius:18px;padding:12px 6px;text-align:center;font-size:12.5px;font-weight:700;position:relative}
.st .av{margin:0 auto 6px;width:46px;height:46px;font-size:16px}
.st .dot{position:absolute;top:10px;right:14px;width:9px;height:9px;border-radius:50%;background:#2ecc71;border:2px solid #fff}
.st.sp{background:#fff4e0}
.att{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef2f1;font-size:14px;gap:8px}
.att .who{display:flex;align-items:center;gap:10px}.att .av{width:32px;height:32px;font-size:12px}
.seg{display:flex;gap:4px}.seg button{border:0;padding:7px 10px;border-radius:9px;font-size:12px;font-weight:800;background:#f1f5f4;color:var(--mut)}
.seg .p.on{background:#2ecc71;color:#fff}.seg .l.on{background:var(--y);color:#3a2a00}.seg .a.on{background:var(--r);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;color:var(--mut);font-weight:700;font-size:12px;padding:8px 6px;border-bottom:1px solid #eef2f1}
td{padding:9px 6px;border-bottom:1px solid #f2f5f4}
.tag{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:8px;display:inline-block}
.ok{background:#e3f8ea;color:#15803d}.no{background:#fde8e7;color:#c0392b}.wt{background:#fff4dc;color:#a76b00}
.gr{border:0;width:30px;height:30px;border-radius:9px;font-weight:900;font-size:13.5px}
.g5{background:#e3f8ea;color:#15803d}.g4{background:#e6f1ff;color:#1d5fd1}.g3{background:#fff4dc;color:#a76b00}.g2{background:#fde8e7;color:#c0392b}.g0{background:#f1f5f4;color:#b5c3c0}
.ring{position:relative;width:150px;height:150px;margin:6px auto}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:900}
.list div{padding:10px 0;border-bottom:1px dashed #e3ebe9;font-size:14px}.list small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.btn{border:0;background:var(--g);color:#fff;font-weight:800;padding:11px 16px;border-radius:12px;font-size:14px}
.btn.lt{background:var(--gl);color:var(--g)}
.in{width:100%;border:2px solid #e3ebe9;border-radius:12px;padding:10px 12px;font-size:14px;font-family:inherit;margin-bottom:8px}
.sch div{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;margin-bottom:8px;background:#f6faf9;font-size:14px}
.sch div.now{background:var(--g);color:#fff}.sch b{min-width:46px}
.ntf{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #eef2f1;font-size:14px}.ntf i{font-style:normal;font-size:20px}
.ntf small{display:block;color:var(--mut);font-size:12px}
.chat{height:230px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px 10px}
.msg{max-width:78%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.35}.msg.t{background:#f1f5f4;align-self:flex-start}.msg.m{background:var(--g);color:#fff;align-self:flex-end}
.cr{display:flex;gap:8px}.cr .in{margin:0}
.child{display:flex;gap:14px;align-items:center}.child .av{width:58px;height:58px;font-size:20px}
.tt{display:grid;grid-template-columns:60px repeat(5,1fr);gap:4px;font-size:12px}.tt div{padding:7px 5px;border-radius:8px;background:#f6faf9;text-align:center}.tt .h{background:none;font-weight:800;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#11302c;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}.toast.on{opacity:1}
.mnav{display:none}
@media(max-width:860px){
 .app{grid-template-columns:1fr}.side{display:none}.main{padding:14px 14px 90px}
 .s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}.s3.kpi{grid-column:span 6}
 .roles{width:100%;overflow-x:auto}.roles button{flex:1;padding:9px 6px;font-size:12.5px}.me{display:none}
 .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e3ebe9;padding:8px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;z-index:5}
 .mnav button{border:0;background:none;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}.mnav button.on{color:var(--g)}.mnav i{font-style:normal;font-size:20px}
}
@media print{.side,.roles,.mnav,.btn{display:none}.app{display:block}}
</style></head><body>
