# Aidoochu English → TestFlight. Runs ONLY when you start it by hand (Actions → "iOS TestFlight" → Run workflow).
#   mode = check  : builds the Release version without signing — no Apple account, no secrets, nothing uploaded.
#   mode = upload : signs with your App Store Connect API key and uploads the build to App Store Connect → TestFlight.
# It never submits to App Review and never publishes to the App Store: that is a separate button in App Store Connect.
# Secrets needed for "upload" (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the text of the AuthKey_XXXX.p8 file, pasted as is), APPLE_TEAM_ID
name: iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = Release build only (no upload); upload = send to TestFlight"
        type: choice
        options: [check, upload]
        default: check
permissions:
  contents: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Upload needs the Apple secrets
        if: inputs.mode == 'upload'
        run: |
          miss=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do [ -n "${!v}" ] || miss="$miss $v"; done
          if [ -n "$miss" ]; then echo "::error::Жетишпеген GitHub Secrets:$miss — ios-app/appstore/APPLE-DEVELOPER-GUIDE.md, 4-кадам"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Install and copy the app (docs/ → ios-app/www → Xcode project)
        working-directory: ios-app
        run: |
          npm ci
          npm run sync
      - name: "check: Release build without signing"
        if: inputs.mode != 'upload'
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive | tail -30
          ls "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" >/dev/null && echo "Release archive OK (unsigned, not uploaded)"
      - name: "upload: sign with the App Store Connect API key and send to TestFlight"
        if: inputs.mode == 'upload'
        working-directory: ios-app/ios/App
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          # the key text as pasted (-----BEGIN PRIVATE KEY----- …); a base64 copy of the file also works
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$ASC_KEY_P8" > "$KEY"; else printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${AUTH[@]}" archive | tail -30
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -30
          echo "Uploaded build ${{ github.run_number }} to App Store Connect. It appears in TestFlight after Apple processes it (5–30 min)."
      - name: Remove the key from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
