# iPhone test build of Aidoochu English (Capacitor). Builds for the iOS Simulator only:
# no signing, no Apple account, no upload, nothing is published. The website (docs/, main branch) is not touched.
name: iOS build (test)
on:
  workflow_dispatch:
  push:
    branches: [claude/ios-capacitor]
    paths: ["ios-app/**", "docs/index.html", "docs/img/**", ".github/workflows/ios-build.yml"]
permissions:
  contents: read
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Install and copy the app (docs/ → ios-app/www → Xcode project)
        working-directory: ios-app
        run: |
          npm ci
          npm run sync
      - name: Build for the iOS Simulator (no signing)
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
          ls build/Build/Products/Debug-iphonesimulator/App.app
      - name: Run in the Simulator and take screenshots (app works offline)
        working-directory: ios-app/ios/App
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for k in sorted(d,reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')][0])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" com.aidoochu.english
          sleep 25
          mkdir -p shots && xcrun simctl io "$UDID" screenshot shots/home.png
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: |
            ios-app/ios/App/shots/
          retention-days: 14
